<style>
:root{
  --wd-ink:#0F1B3D; --wd-paper:#FAFAF7; --wd-electric:#2F6FED;
  --wd-line:#E4E4DC; --wd-line-2:#EFEFE7; --wd-electric-l:#E8F0FE;
  --wd-ink-3:#4A5578; --wd-ink-4:#8791AF; --wd-ink-5:#B7BFD3;
  --wd-electric-d:#1E4FBE; --wd-green:#0E8F60; --wd-red:#DC2E37;
  --ease:cubic-bezier(.22,.7,.2,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-tap-highlight-color:transparent}
html,body{background:#EFEEE7;font-family:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;color:var(--wd-ink);overflow-x:hidden}
body{
  min-height:100vh;
  background:
    radial-gradient(1200px 800px at 50% -200px, #F8F7F1 0%, #EFEEE7 50%, #E5E4DC 100%);
  padding:20px 16px 60px;
}
a{color:inherit;text-decoration:none}
img,svg{display:block;max-width:100%}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;font-size:inherit}

/* ============ NAVBAR ============ */
.nav{
  max-width:1180px;margin:0 auto 24px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.brand{
  display:flex;align-items:center;gap:10px;
  font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:20px;letter-spacing:-.3px;
}
.brand em{font-style:normal;color:var(--wd-electric)}
.brand svg{width:22px;height:22px}
.nav .actions{display:flex;gap:8px;align-items:center}
.act-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:9px 16px;border-radius:99px;
  font-weight:600;font-size:13px;color:var(--wd-ink);
  background:#fff;border:1px solid var(--wd-line);
  cursor:pointer;transition:all .2s var(--ease);
}
.act-btn:hover{background:var(--wd-ink);color:#fff;border-color:var(--wd-ink)}
.act-btn.pri{background:var(--wd-ink);color:#fff;border-color:var(--wd-ink)}
.act-btn.pri:hover{background:var(--wd-electric);border-color:var(--wd-electric)}
.act-btn svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ============ CONFETTI CANVAS ============ */
#confetti{
  position:fixed;inset:0;pointer-events:none;z-index:5;
  opacity:1;transition:opacity 1.5s var(--ease);
}
#confetti.fade{opacity:0}

/* ============ VERIFY BADGE ============ */
.verify-badge{
  max-width:640px;margin:0 auto 24px;
  display:flex;align-items:center;justify-content:center;gap:14px;
  padding:16px 24px;
  background:linear-gradient(90deg, rgba(14,143,96,.10), rgba(14,143,96,.02));
  border:1px solid rgba(14,143,96,.28);
  border-radius:16px;
  font-size:14px;color:var(--wd-ink);
  flex-wrap:wrap;text-align:center;
  box-shadow:0 8px 24px -8px rgba(14,143,96,.15);
  opacity:0;transform:translateY(-8px);
  animation:fadeInDown .5s var(--ease-out) .2s forwards;
  position:relative;z-index:10;
}
.verify-badge .ic-check{
  width:38px;height:38px;flex-shrink:0;
  background:var(--wd-green);color:#fff;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 20px -6px rgba(14,143,96,.6);
  position:relative;
}
.verify-badge .ic-check svg{width:20px;height:20px;stroke:currentColor;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.verify-badge .ic-check .checkmark{
  stroke-dasharray:24;stroke-dashoffset:24;
  animation:drawCheck .6s var(--ease-out) .5s forwards;
}
.verify-badge .ic-check::before{
  content:"";position:absolute;inset:-4px;border-radius:50%;
  border:2px solid var(--wd-green);opacity:0;
  animation:pulseRing 1.4s var(--ease-out) .8s;
}
.verify-badge b{color:var(--wd-green);font-weight:700}

.verify-badge.err{
  background:linear-gradient(90deg, rgba(220,46,55,.10), rgba(220,46,55,.02));
  border-color:rgba(220,46,55,.28);
}
.verify-badge.err .ic-check{background:var(--wd-red);box-shadow:0 6px 20px -6px rgba(220,46,55,.6)}
.verify-badge.err .ic-check::before{border-color:var(--wd-red)}
.verify-badge.err b{color:var(--wd-red)}

@keyframes fadeInDown{
  to{opacity:1;transform:translateY(0)}
}
@keyframes drawCheck{
  to{stroke-dashoffset:0}
}
@keyframes pulseRing{
  0%{transform:scale(1);opacity:.7}
  100%{transform:scale(1.5);opacity:0}
}

/* ============ CERT SLIDE-IN ============ */
.cert-wrap{
  width:1123px;max-width:100%;margin:0 auto;
  opacity:0;transform:translateY(24px) scale(.98);
  animation:certReveal .7s var(--ease-out) .4s forwards;
}
@keyframes certReveal{
  to{opacity:1;transform:translateY(0) scale(1)}
}

.cert{
  width:1123px;height:794px;position:relative;overflow:hidden;
  box-shadow:
    0 60px 120px -50px rgba(15,27,61,.35),
    0 20px 40px -20px rgba(15,27,61,.18),
    0 0 0 1px rgba(15,27,61,.05);
  border-radius:6px;
  background:#FEFDF9;color:var(--wd-ink);
  display:grid;grid-template-columns:0.92fr 1.08fr;
  transform-origin:top center;
  transform:scale(var(--sc, 1));
  margin-bottom:calc((var(--sc, 1) - 1) * 794px);
}

/* LEFT — DARK NAVY */
.wdc-l{
  position:relative;background:var(--wd-ink);color:#F6F6F1;
  padding:52px 46px 44px;display:flex;flex-direction:column;overflow:hidden;
}
.wdc-l::before{
  content:"";position:absolute;right:-160px;top:-140px;
  width:460px;height:460px;border-radius:50%;
  background:radial-gradient(circle,rgba(47,111,237,.28) 0%,transparent 65%);
  pointer-events:none;
}
.wdc-l::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.03) 1px, transparent 1px);
  background-size:14px 14px;opacity:.55;
}
.cbrand{display:flex;align-items:center;gap:12px;position:relative;z-index:2}
.cbrand .mk{
  width:38px;height:38px;border-radius:10px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.cbrand .mk svg{width:18px;height:18px}
.cbrand-txt{display:flex;flex-direction:column;gap:2px}
.cbrand .nm{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:19px;letter-spacing:-.4px;color:#fff;line-height:1}
.cbrand .nm em{font-style:normal;color:#8FB4F8}
.cbrand .tag{font-family:"JetBrains Mono",monospace;font-weight:500;font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;color:#8791AF;line-height:1}
.cmid{position:relative;z-index:2;margin:auto 0;padding:20px 0}
.ckicker{
  display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);
  border-radius:99px;font-weight:600;font-size:10px;letter-spacing:1.4px;
  text-transform:uppercase;color:#B7BFD3;margin-bottom:22px;line-height:1;
}
.ckicker .dt{width:5px;height:5px;border-radius:99px;background:var(--wd-electric);box-shadow:0 0 8px var(--wd-electric);flex-shrink:0}
.ctitle{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:52px;letter-spacing:-1.4px;line-height:1;color:#fff}
.ctitle .it{display:block;font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;font-size:1.05em;letter-spacing:-.4px;color:#DDE3F0;line-height:1.05;margin-top:4px}
.cto{margin-top:22px;font-weight:600;font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;color:#8791AF;line-height:1}
.ccand{margin-top:6px;display:flex;align-items:flex-end;gap:16px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.16)}
.cname{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:40px;letter-spacing:-1.1px;line-height:1.05;color:#fff;flex:1;min-width:0}
.cprog{margin-top:18px;font-size:12.5px;line-height:1.55;color:#B7BFD3;max-width:440px}
.cprog b{color:#fff;font-weight:600}
.cfoot-l{position:relative;z-index:2;margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding-top:20px;border-top:1px solid rgba(255,255,255,.1)}
.csig{display:flex;flex-direction:column;gap:0;align-items:flex-start}
.csig-plate{
  background:#FFFFFF;width:180px;padding:4px 0 0 0;
  border-radius:3px 3px 0 0;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(0,0,0,.18);margin:0;line-height:0;
}
.csig-plate img{height:44px;width:auto;max-width:160px;display:block}
.csig .ln{width:180px;height:1.5px;background:rgba(255,255,255,.55);margin:0}
.csig .rl{font-weight:600;font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:#8791AF;line-height:1.3;margin-top:6px}
.csig .rl b{color:#fff;font-weight:700}
.cser{text-align:right;font-family:"JetBrains Mono",monospace;font-size:10px;color:#8791AF;line-height:1.6;letter-spacing:.2px}
.cser b{color:#fff;font-weight:700;font-size:10.5px;letter-spacing:.4px}

/* RIGHT — LIGHT PAPER */
.wdc-r{
  position:relative;background:var(--wd-paper);padding:44px 46px 32px;
  display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;
}
.wdc-r::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(15,27,61,.03) 1px, transparent 1px);background-size:16px 16px;opacity:.7}
.cr-top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;align-self:start}
.cr-top .lbl{font-weight:700;font-size:10px;letter-spacing:2.2px;text-transform:uppercase;color:var(--wd-ink-3);line-height:1.3}
.cr-top .date{text-align:right;font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--wd-ink-3);line-height:1.6}
.cr-top .date b{color:var(--wd-ink);font-weight:700;font-size:11px;letter-spacing:.4px}
.cr-center{display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:0}
.cband{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0;width:100%}
.cband-row{display:flex;align-items:center;justify-content:center;gap:16px;width:auto}
.cband-num{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;font-size:170px;line-height:1;letter-spacing:0;color:var(--wd-ink);font-variant-numeric:tabular-nums;padding:0;display:block;min-width:180px}
.cband-num .dec{color:var(--wd-electric)}
.cband-meta{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:12px}
.cband-of{font-weight:700;font-size:11px;letter-spacing:2px;color:var(--wd-ink-3);text-transform:uppercase;line-height:1.2;white-space:nowrap}
.cband-of b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:24px;color:var(--wd-ink);letter-spacing:-.5px;text-transform:none;line-height:1;margin-top:3px}
.ccefr{
  font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:22px;
  color:var(--wd-electric);letter-spacing:-.3px;padding:6px 12px;
  background:var(--wd-electric-l);border-radius:6px;line-height:1;
  white-space:nowrap;display:inline-block;
  opacity:0;transform:scale(.8);
  animation:popIn .5s var(--ease-out) 1.6s forwards;
}
@keyframes popIn{
  to{opacity:1;transform:scale(1)}
}
.cverdict{
  margin-top:18px;font-family:"Instrument Serif",serif;font-style:italic;font-size:19px;
  color:#1F2A50;line-height:1.4;max-width:100%;text-align:center;padding:0 20px;
  letter-spacing:0;word-spacing:0.05em;
  opacity:0;
  animation:fadeIn .5s var(--ease-out) 1.8s forwards;
}
@keyframes fadeIn{
  to{opacity:1}
}
.cmods{margin-top:18px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;position:relative;z-index:2;width:100%}
.cmod{
  padding:14px 14px 12px;background:#fff;border:1px solid var(--wd-line-2);
  border-radius:12px;display:flex;flex-direction:column;gap:6px;
  opacity:0;transform:translateY(8px);
  animation:modIn .4s var(--ease-out) forwards;
}
.cmod:nth-child(1){animation-delay:1.9s}
.cmod:nth-child(2){animation-delay:2.0s}
.cmod:nth-child(3){animation-delay:2.1s}
.cmod:nth-child(4){animation-delay:2.2s}
@keyframes modIn{
  to{opacity:1;transform:translateY(0)}
}
.cmod .l{display:flex;align-items:center;gap:6px;font-weight:700;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--wd-ink-3);line-height:1}
.cmod .l svg{width:12px;height:12px;color:var(--wd-electric);stroke:currentColor;stroke-width:2;fill:none;flex-shrink:0}
.cmod .v{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:26px;letter-spacing:-.8px;color:var(--wd-ink);line-height:1;font-variant-numeric:tabular-nums}
.cmod .bar{height:3px;border-radius:3px;background:var(--wd-line-2);overflow:hidden;margin-top:2px}
.cmod .bar i{
  display:block;height:100%;background:var(--wd-ink);border-radius:3px;
  width:0;transition:width .8s var(--ease-out);
}
.cr-bot{position:relative;z-index:2;padding-top:16px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:flex-start;border-top:1px dashed var(--wd-line);align-self:end}
.cqr-block{display:flex;align-items:center;gap:12px}
.cqr-code{width:74px;height:74px;padding:5px;background:#fff;border:1px solid var(--wd-line);border-radius:8px;flex-shrink:0}
.cqr-code svg{display:block;width:100%;height:100%}
.cqr-txt{font-family:"JetBrains Mono",monospace;font-size:9.5px;color:var(--wd-ink-3);line-height:1.55;letter-spacing:.2px;display:flex;flex-direction:column;gap:1px}
.cqr-txt b{color:var(--wd-ink);font-weight:700;font-size:10px;margin-bottom:3px;font-family:"Plus Jakarta Sans",sans-serif;text-transform:uppercase;letter-spacing:1.2px;line-height:1}
.cqr-txt .url{color:var(--wd-electric);font-weight:600}
.cdisc{font-size:9.2px;line-height:1.55;color:var(--wd-ink-3);text-align:right;padding-left:12px;border-left:1px solid var(--wd-line)}
.cdisc b{color:var(--wd-ink);font-weight:700;font-size:9.5px}

/* Responsive scale */
@media (max-width:1180px){
  .cert-wrap{width:100%}
}

/* ============ ACTION BAR ============ */
.action-bar{
  max-width:640px;margin:28px auto 0;
  display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
  opacity:0;transform:translateY(12px);
  animation:fadeInUp .5s var(--ease-out) 2.4s forwards;
}
@keyframes fadeInUp{
  to{opacity:1;transform:translateY(0)}
}
.action-btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:12px 20px;border-radius:99px;
  font-weight:600;font-size:14px;color:var(--wd-ink);
  background:#fff;border:1px solid var(--wd-line);
  cursor:pointer;transition:all .2s var(--ease);
  box-shadow:0 4px 12px -4px rgba(15,27,61,.1);
  position:relative;overflow:hidden;
}
.action-btn:hover{background:var(--wd-ink);color:#fff;border-color:var(--wd-ink);transform:translateY(-2px);box-shadow:0 8px 20px -6px rgba(15,27,61,.25)}
.action-btn.share:hover{background:#22C55E;border-color:#22C55E}
.action-btn.copy:hover{background:var(--wd-electric);border-color:var(--wd-electric)}
.action-btn.print:hover{background:var(--wd-ink);border-color:var(--wd-ink)}
.action-btn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.action-btn.copied{background:var(--wd-green);color:#fff;border-color:var(--wd-green)}

/* Share popover */
.share-pop{
  position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(-4px);
  display:flex;gap:6px;padding:8px;
  background:#fff;border:1px solid var(--wd-line);border-radius:14px;
  box-shadow:0 12px 32px -8px rgba(15,27,61,.2);
  opacity:0;pointer-events:none;transition:all .2s var(--ease);
  z-index:20;
}
.share-btn-wrap{position:relative}
.share-btn-wrap.on .share-pop{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.share-pop a{
  width:38px;height:38px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;color:var(--wd-ink);
  background:var(--wd-line-2);
}
.share-pop a:hover{transform:scale(1.1);background:var(--wd-electric-l);color:var(--wd-electric)}
.share-pop a svg{width:18px;height:18px}
.share-pop a.tg:hover{background:#0088cc;color:#fff}
.share-pop a.wa:hover{background:#25D366;color:#fff}
.share-pop a.tw:hover{background:#000;color:#fff}
.share-pop a.fb:hover{background:#1877F2;color:#fff}
.share-pop a.li:hover{background:#0A66C2;color:#fff}

/* ============ CEFR INFO CARD ============ */
.info-cards{
  max-width:900px;margin:32px auto 0;
  display:grid;grid-template-columns:1fr 1fr;gap:16px;
  opacity:0;transform:translateY(12px);
  animation:fadeInUp .5s var(--ease-out) 2.6s forwards;
}
@media (max-width:720px){
  .info-cards{grid-template-columns:1fr}
}
.info-card{
  background:#fff;border:1px solid var(--wd-line);border-radius:20px;
  padding:24px;
  box-shadow:0 6px 20px -8px rgba(15,27,61,.08);
  cursor:pointer;
  transition:all .3s var(--ease);
  overflow:hidden;
  position:relative;
}
.info-card:hover{transform:translateY(-2px);box-shadow:0 12px 28px -10px rgba(15,27,61,.18);border-color:var(--wd-ink-4)}
.info-card .ic-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
}
.info-card .ic-lbl{
  display:inline-flex;align-items:center;gap:6px;
  font-family:"JetBrains Mono",monospace;font-weight:600;font-size:10px;
  letter-spacing:1.4px;text-transform:uppercase;color:var(--wd-ink-3);
  margin-bottom:4px;
}
.info-card .ic-lbl .dot{width:6px;height:6px;border-radius:50%;background:var(--wd-electric)}
.info-card h3{
  font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:22px;
  letter-spacing:-.6px;line-height:1.15;color:var(--wd-ink);
}
.info-card h3 .b{color:var(--wd-electric)}
.info-card .chevron{
  width:32px;height:32px;flex-shrink:0;
  background:var(--wd-line-2);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  transition:all .3s var(--ease);
}
.info-card.open .chevron{background:var(--wd-electric);color:#fff;transform:rotate(180deg)}
.info-card .chevron svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.info-card .ic-content{
  max-height:0;overflow:hidden;
  transition:max-height .4s var(--ease), margin-top .4s var(--ease);
  color:var(--wd-ink-3);font-size:14px;line-height:1.6;
}
.info-card.open .ic-content{max-height:600px;margin-top:16px}
.info-card .ic-content b{color:var(--wd-ink);font-weight:600}
.info-card .ic-content ul{margin:8px 0 0 18px;padding:0}
.info-card .ic-content li{margin:4px 0}
.info-card .ic-content .tag-row{
  display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;
}
.info-card .ic-content .tag{
  padding:4px 10px;border-radius:99px;
  background:var(--wd-electric-l);color:var(--wd-electric-d);
  font-size:12px;font-weight:600;
}

/* ============ CTA BLOCK ============ */
.cta-block{
  max-width:900px;margin:32px auto 0;
  padding:32px 28px;
  background:linear-gradient(135deg, var(--wd-ink) 0%, #1A2340 100%);
  border-radius:24px;
  color:#fff;
  display:flex;align-items:center;justify-content:space-between;gap:24px;
  flex-wrap:wrap;
  position:relative;overflow:hidden;
  opacity:0;transform:translateY(16px);
  animation:fadeInUp .5s var(--ease-out) 2.8s forwards;
  box-shadow:0 20px 40px -20px rgba(15,27,61,.3);
}
.cta-block::before{
  content:"";position:absolute;
  right:-100px;bottom:-100px;
  width:320px;height:320px;border-radius:50%;
  background:radial-gradient(circle,rgba(47,111,237,.35) 0%,transparent 65%);
  pointer-events:none;
}
.cta-block::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.04) 1px, transparent 1px);
  background-size:14px 14px;opacity:.6;
}
.cta-txt{position:relative;z-index:2;flex:1;min-width:240px}
.cta-txt .k{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 12px 5px 8px;
  background:rgba(143,180,248,.15);border:1px solid rgba(143,180,248,.25);
  border-radius:99px;
  font-weight:600;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:#8FB4F8;
  margin-bottom:12px;
}
.cta-txt .k .dt{width:5px;height:5px;border-radius:50%;background:#8FB4F8;box-shadow:0 0 8px #8FB4F8}
.cta-txt h2{
  font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:28px;
  letter-spacing:-.8px;line-height:1.15;color:#fff;
}
.cta-txt h2 .it{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;color:#8FB4F8}
.cta-txt p{
  margin-top:8px;font-size:14px;line-height:1.55;color:#B7BFD3;max-width:480px;
}
.cta-btn{
  position:relative;z-index:2;
  display:inline-flex;align-items:center;gap:10px;
  padding:14px 24px;border-radius:99px;
  background:var(--wd-electric);color:#fff;
  font-weight:700;font-size:14px;
  transition:all .2s var(--ease);
  box-shadow:0 8px 24px -6px rgba(47,111,237,.5);
  flex-shrink:0;
}
.cta-btn:hover{background:#4C87FF;transform:translateY(-2px);box-shadow:0 12px 32px -8px rgba(47,111,237,.65)}
.cta-btn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s var(--ease)}
.cta-btn:hover svg{transform:translateX(3px)}

/* ============ ERROR STATE ============ */
.error-state{
  max-width:640px;margin:80px auto 40px;
  padding:40px 32px;
  background:#fff;border-radius:24px;
  box-shadow:0 40px 80px -30px rgba(15,27,61,.25), 0 0 0 1px rgba(15,27,61,.06);
  text-align:center;
  opacity:0;transform:translateY(12px);
  animation:fadeInUp .5s var(--ease-out) .2s forwards;
}
.error-state .icon-lg{
  width:72px;height:72px;margin:0 auto 20px;
  background:linear-gradient(135deg, rgba(220,46,55,.12) 0%, rgba(220,46,55,.04) 100%);
  border:1px solid rgba(220,46,55,.2);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--wd-red);
}
.error-state .icon-lg svg{width:32px;height:32px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.error-state h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:28px;letter-spacing:-.8px;line-height:1.1;color:var(--wd-ink)}
.error-state p{margin-top:12px;font-size:15px;line-height:1.55;color:var(--wd-ink-3)}
.error-state code{
  display:inline-block;margin:14px 0 20px;
  padding:6px 12px;background:var(--wd-line-2);border-radius:6px;
  font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--wd-ink);
  word-break:break-all;max-width:100%;
}
.error-state .go-home{
  display:inline-flex;align-items:center;gap:8px;
  margin-top:8px;padding:12px 22px;border-radius:99px;
  background:var(--wd-ink);color:#fff;font-weight:600;font-size:14px;
  transition:background .2s;
}
.error-state .go-home:hover{background:var(--wd-electric)}
.error-state .go-home svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ============ LOADING ============ */
.loading{
  max-width:400px;margin:120px auto;text-align:center;color:var(--wd-ink-3);
}
.loading .sp{
  width:34px;height:34px;margin:0 auto 16px;
  border:3px solid var(--wd-line);border-top:3px solid var(--wd-electric);
  border-radius:50%;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{font-size:14px}

/* ============ TOAST ============ */
.toast{
  position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(20px);
  padding:12px 20px;background:var(--wd-ink);color:#fff;
  border-radius:99px;font-weight:600;font-size:13px;
  box-shadow:0 12px 32px -8px rgba(15,27,61,.4);
  opacity:0;pointer-events:none;transition:all .3s var(--ease);
  z-index:1000;display:flex;align-items:center;gap:8px;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;color:var(--wd-green)}

/* ============ FOOTER ============ */
.foot{
  max-width:1180px;margin:60px auto 0;padding:24px 0;
  border-top:1px solid var(--wd-line);
  display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
  font-size:12px;color:var(--wd-ink-3);
}
.foot a{color:var(--wd-electric);font-weight:600}

/* ============ PRINT ============ */
@page{size:A4 landscape;margin:0}
@media print{
  html,body{background:#fff;padding:0;overflow:visible}
  .nav,.verify-badge,.foot,.error-state,.action-bar,.info-cards,.cta-block,#confetti,.toast{display:none !important}
  .cert-wrap{width:auto;margin:0;animation:none !important;opacity:1 !important;transform:none !important}
  .cert{
    width:297mm;height:210mm;box-shadow:none;border-radius:0;
    transform:none !important;margin:0 !important;
  }
  .ccefr,.cverdict,.cmod{animation:none !important;opacity:1 !important;transform:none !important}
}

/* Reduced motion */
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01s !important;transition-duration:.01s !important}
  #confetti{display:none}
}


/* =================================================================
   VERIFY → INDEX DESIGN LANGUAGE
   index.html dizayn tili (ko'k-navy sirtlar, Bricolage + Fraunces,
   assimetrik radiuslar) + sertifikat layout tuzatishlari.
   HTML va JS o'zgarmagan — faqat shu CSS bloki.
   ================================================================= */

/* ---------- 1. index.html tokenlari ---------- */
:root{
  /* Brand ink */
  --ink:#08183A; --ink-2:#0F1B3D; --ink-3:#54628A; --ink-4:#8492B4;
  /* Ko'k sirt palitrasi */
  --surface:#EEF4FF; --surface-2:#E4EDFB; --surface-3:#DCE6F7; --soft:#F5F9FF;
  --line:#DCE6F7; --line-2:#E4EDFB;
  /* Brend ko'ki */
  --blue:#2F6FED; --blue-d:#1B4FCB; --blue-l:#5B8CFF; --blue-tint:#E8F0FE;
  --accent:#0E8F60; --gold:#F5B62E; --deep:#061A46;

  /* verify.html eski tokenlari → index qiymatlariga bog'landi */
  --wd-ink:#08183A; --wd-ink-3:#54628A; --wd-ink-4:#8492B4; --wd-ink-5:#A9B6D4;
  --wd-paper:#F5F9FF; --wd-line:#DCE6F7; --wd-line-2:#E4EDFB;
  --wd-electric:#2F6FED; --wd-electric-d:#1B4FCB; --wd-electric-l:#E8F0FE;
  --wd-green:#0E8F60; --wd-red:#D6272C;

  --disp:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif;
  --sans:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --serif:"Fraunces",ui-serif,Georgia,serif;
  --ease:cubic-bezier(.22,.7,.2,1);
}

/* ---------- 2. Sahifa foni — index bilan bir xil ---------- */
html,body{
  font-family:var(--sans); color:var(--ink); background:var(--surface);
  line-height:1.62;
}
body{
  background:
    radial-gradient(900px 520px at 82% -160px, rgba(91,140,255,.16) 0%, rgba(91,140,255,0) 62%),
    radial-gradient(760px 460px at 6% 2%, rgba(47,111,237,.08) 0%, rgba(47,111,237,0) 60%),
    var(--surface);
  padding:0 0 0 0;
  min-height:100vh;
}
/* index.html'dagi nuqtali hero teksturasi */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(circle, rgba(27,79,203,.22) 1.4px, transparent 1.4px);
  background-size:28px 28px;
  -webkit-mask-image:radial-gradient(60% 42% at 82% 4%, #000 0%, transparent 74%);
  mask-image:radial-gradient(60% 42% at 82% 4%, #000 0%, transparent 74%);
}
#root,.nav,.verify-badge,.foot,.toast{position:relative;z-index:1}

/* ---------- 3. Nav — index'ning sticky shisha paneli ---------- */
.nav{
  position:sticky;top:0;z-index:80;
  max-width:none;margin:0 0 8px;
  padding:0 max(24px, calc((100% - 1180px) / 2));height:70px;
  background:rgba(238,244,255,.72);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line-2);
  box-shadow:0 8px 24px -18px rgba(6,26,70,.35);
}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:nowrap}
.brand{
  font-family:var(--disp);font-weight:800;font-size:22px;
  letter-spacing:-.6px;color:var(--ink);gap:10px;
}
/* Brend logotipi — index.html'dagi bir xil uch qatlamli tomchi */
.brand{display:flex;align-items:center;gap:10px}
.brand .label em{font-style:normal;color:var(--blue)}
.brand .mark{width:24px;height:24px;flex:none}
.brand:hover{color:var(--ink)}
/* index'ning assimetrik CTA tugmasi */
.act-btn{
  border-radius:14px 14px 14px 5px;
  border:1px solid var(--line);background:#fff;color:var(--ink);
  font-weight:600;font-size:14px;padding:10px 18px;
  transition:background-color .2s,color .2s,border-color .2s,transform .1s;
}
.act-btn:hover{background:var(--surface-2);color:var(--ink);border-color:#B4C7EA}
.act-btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.act-btn.pri:hover{background:var(--blue);border-color:var(--blue);color:#fff}
.act-btn:active{transform:translateY(1px)}

/* Sahifa ichki chegarasi (body padding olib tashlandi) */
#root{padding:20px 16px 0}
.verify-badge{margin:20px auto 24px}

/* ---------- 4. Tasdiq banneri ---------- */
.verify-badge{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px 18px 18px 6px;
  box-shadow:0 10px 28px -16px rgba(6,26,70,.28);
  color:var(--ink);
}
.verify-badge b{color:var(--accent)}
.verify-badge .ic-check{background:var(--accent);box-shadow:0 6px 18px -8px rgba(14,143,96,.6)}
.verify-badge .ic-check::before{border-color:var(--accent)}
.verify-badge.err{background:#fff;border-color:rgba(214,39,44,.3)}
.verify-badge.err b{color:var(--wd-red)}

/* =================================================================
   5. SERTIFIKAT — layout tuzatishlari
   ================================================================= */
.cert{
  background:#FCFDFF;
  border-radius:10px;
  box-shadow:
    0 60px 120px -50px rgba(6,26,70,.42),
    0 20px 40px -20px rgba(6,26,70,.2),
    0 0 0 1px rgba(6,26,70,.06);
  grid-template-columns:0.95fr 1.05fr;
}

/* 5a. CHAP PANEL — flex+margin:auto o'rniga aniq 3 qatorli grid.
   Sabab: uzun ism/matnda kontent 794px dan oshib, overflow:hidden
   uni jimgina kesib tashlar edi. */
.wdc-l{
  background:var(--deep);
  display:grid;grid-template-rows:auto 1fr auto;gap:20px;
  padding:48px 44px 40px;align-content:stretch;
}
.wdc-l::before{background:radial-gradient(circle,rgba(91,140,255,.3) 0%,transparent 65%)}
.cmid{margin:0;padding:0;align-self:center;min-height:0}
.cfoot-l{margin-top:0}

.cbrand .nm{font-family:var(--disp)}
.cbrand .nm em{color:var(--blue-l)}
.cbrand .mk{
  border-radius:12px 12px 12px 4px;
  background:rgba(91,140,255,.12);border-color:rgba(91,140,255,.3);
}
.cbrand .mk svg{width:20px;height:20px}
.ckicker .dt{background:var(--blue-l);box-shadow:0 0 8px var(--blue-l)}
.ctitle{font-family:var(--disp);font-size:50px;letter-spacing:-1.5px}
/* Fraunces — index'ning serif akcenti */
.ctitle .it{
  font-family:var(--serif);font-style:italic;font-weight:500;
  font-size:1em;letter-spacing:-.5px;color:#C9D6F2;margin-top:6px;
}
/* 5b. Uzun ismlar endi kesilmaydi, o'raladi */
.ccand{align-items:flex-end;gap:12px;padding-bottom:12px}
.cname{
  font-family:var(--disp);font-size:38px;letter-spacing:-1.1px;line-height:1.04;
  overflow-wrap:anywhere;hyphens:auto;
}
.cprog{font-size:12.5px;line-height:1.6;color:#B9C6E4;max-width:100%}

/* 5c. Imzo bloki — plastinka, chiziq va rol matni bir xil kenglikda */
.csig{align-items:flex-start;min-width:0}
.csig-plate{border-radius:4px 4px 0 0}
.cfoot-l{align-items:flex-end;gap:20px}
.cser{white-space:nowrap;flex-shrink:0}

/* 5d. O'NG PANEL */
.wdc-r{background:var(--soft);padding:40px 44px 28px;row-gap:16px}
.wdc-r::before{background-image:radial-gradient(rgba(8,24,58,.04) 1px, transparent 1px)}
.cr-top{align-items:baseline}
.cr-top .lbl{color:var(--ink-3)}

/* 5e. Ball bloki — raqam va meta ustuni optik moslashtirildi.
   min-width:180px olib tashlandi (u 10.0 dan kichik ballarda
   markazni chapga siljitardi). */
.cr-center{gap:0;padding:8px 0}
.cband-row{align-items:center;gap:18px}
.cband-num{
  font-family:var(--serif);font-style:italic;font-weight:500;
  font-size:158px;line-height:.92;min-width:0;
  color:var(--ink);font-variant-numeric:tabular-nums;
}
.cband-num .dec{color:var(--blue)}
.cband-meta{gap:14px;padding-bottom:8px}
.cband-of b{font-family:var(--disp)}
.ccefr{
  font-family:var(--disp);background:var(--blue-tint);color:var(--blue);
  border-radius:10px 10px 10px 3px;padding:7px 13px;
}
.cverdict{
  font-family:var(--serif);font-style:italic;font-weight:500;
  font-size:18px;color:var(--ink-2);margin-top:14px;padding:0 8px;
  max-width:46ch;margin-left:auto;margin-right:auto;
}

/* 5f. Modul kartalari */
.cmods{margin-top:20px;gap:11px}
.cmod{
  border-radius:14px 14px 14px 5px;border-color:var(--line);
  box-shadow:0 2px 8px -4px rgba(6,26,70,.12);
  min-width:0;
}
.cmod .l{color:var(--ink-3);gap:5px;min-width:0}
.cmod .l svg{color:var(--blue)}
.cmod .v{font-family:var(--disp)}
.cmod .bar{background:var(--line-2);height:4px;border-radius:4px}
.cmod .bar i{background:linear-gradient(90deg,var(--blue),var(--blue-d));border-radius:4px}

/* 5g. Pastki qator — QR va ogohlantirish endi teng balanslangan.
   Oldin `auto 1fr` + `text-align:right` matnni siqib, o'qishni
   qiyinlashtirardi; hozir 1fr/1fr va chapdan tekislangan. */
.cr-bot{
  grid-template-columns:minmax(200px,auto) 1fr;
  gap:20px;align-items:center;padding-top:14px;
  border-top:1px dashed var(--line);
}
.cqr-block{align-items:center;gap:14px;min-width:0}
.cqr-code{
  width:78px;height:78px;border-radius:10px 10px 10px 3px;
  border-color:var(--line);box-shadow:0 2px 8px -4px rgba(6,26,70,.14);
}
.cqr-txt{min-width:0;overflow-wrap:anywhere}
.cqr-txt .url{color:var(--blue)}
.cdisc{
  font-size:9.6px;line-height:1.6;color:var(--ink-3);
  text-align:left;padding-left:18px;border-left:1px solid var(--line);
  align-self:center;
}
.cdisc b{color:var(--ink)}

/* ---------- 6. Amal tugmalari ---------- */
.action-btn{
  border-radius:14px 14px 14px 5px;
  border-color:var(--line);color:var(--ink);
  box-shadow:0 4px 12px -6px rgba(6,26,70,.18);
}
.action-btn:hover{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 10px 22px -10px rgba(6,26,70,.35)}
.action-btn.share:hover{background:var(--accent);border-color:var(--accent)}
.action-btn.copy:hover{background:var(--blue);border-color:var(--blue)}
.action-btn.copied{background:var(--accent);border-color:var(--accent)}
.share-pop{border-radius:16px 16px 16px 5px;border-color:var(--line);box-shadow:0 14px 34px -14px rgba(6,26,70,.3)}
.share-pop a{border-radius:11px 11px 11px 3px;background:var(--surface-2);color:var(--ink)}
.share-pop a:hover{background:var(--blue-tint);color:var(--blue)}

/* ---------- 7. Info kartalar ---------- */
.info-card{
  border-radius:20px 20px 20px 6px;border-color:var(--line);
  box-shadow:0 8px 24px -14px rgba(6,26,70,.16);
}
.info-card:hover{border-color:#B4C7EA;box-shadow:0 16px 34px -16px rgba(6,26,70,.24)}
.info-card h3{font-family:var(--disp);color:var(--ink)}
.info-card h3 .b{color:var(--blue)}
.info-card .ic-lbl{color:var(--ink-3)}
.info-card .ic-lbl .dot{background:var(--blue)}
.info-card .chevron{background:var(--surface-2);color:var(--ink-3)}
.info-card.open .chevron{background:var(--blue);color:#fff}
.info-card .ic-content{color:var(--ink-3)}
.info-card .ic-content b{color:var(--ink)}
.info-card .ic-content .tag{background:var(--blue-tint);color:var(--blue-d);border-radius:99px}

/* ---------- 8. CTA — index'ning deep navy bloki ---------- */
.cta-block{
  background:linear-gradient(135deg,var(--deep) 0%,#0D2255 100%);
  border-radius:26px 26px 26px 8px;
  box-shadow:0 24px 48px -24px rgba(6,26,70,.45);
}
.cta-block::before{background:radial-gradient(circle,rgba(91,140,255,.38) 0%,transparent 65%)}
.cta-txt .k{background:rgba(91,140,255,.16);border-color:rgba(91,140,255,.28);color:#9FBEFF}
.cta-txt .k .dt{background:#9FBEFF;box-shadow:0 0 8px #9FBEFF}
.cta-txt h2{font-family:var(--disp);font-size:30px}
.cta-txt h2 .it{font-family:var(--serif);font-style:italic;font-weight:500;color:#9FBEFF}
.cta-txt p{color:#B9C6E4}
.cta-btn{
  background:linear-gradient(150deg,var(--blue-l) 0%,var(--blue) 45%,var(--blue-d) 100%);
  border-radius:18px 18px 18px 6px;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.3), 0 14px 30px -12px rgba(15,45,120,.6);
}
.cta-btn:hover{background:linear-gradient(150deg,#7CA1FF 0%,var(--blue) 45%,var(--blue-d) 100%);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.36), 0 18px 36px -12px rgba(15,45,120,.68)}

/* ---------- 9. Xato / yuklanish / toast / footer ---------- */
.error-state{
  border-radius:24px 24px 24px 8px;
  box-shadow:0 40px 80px -34px rgba(6,26,70,.3), 0 0 0 1px rgba(6,26,70,.06);
}

<script>
/* ============ HELPERS ============ */
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function bandVerdict(b){
  if(b>=8.5) return "Expert user — mutlaqo erkin";
  if(b>=8)   return "Very good — expertga juda yaqin";
  if(b>=7.5) return "Very good — kuchli barqarorlik";
  if(b>=7)   return "Good — universitet talabi";
  if(b>=6.5) return "Competent — ishonchli poydevor";
  if(b>=6)   return "Competent — barqarorlikni oshiring";
  if(b>=5.5) return "Modest — o'rtacha barqarorlik";
  if(b>=5)   return "Modest — muntazam mashq kerak";
  if(b>=4.5) return "Limited — asoslarni mustahkamlang";
  return "Boshlang'ich daraja";
}
function bandCEFR(b){
  if(b>=8) return "C2"; if(b>=7) return "C1";
  if(b>=5.5) return "B2"; if(b>=4) return "B1";
  if(b>=3) return "A2"; return "A1";
}
function fmtDate(d){
  const dt = d instanceof Date ? d : new Date(d);
  const m = ['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentabr','oktabr','noyabr','dekabr'];
  return String(dt.getDate()).padStart(2,'0') + ' ' + m[dt.getMonth()] + ' ' + dt.getFullYear();
}
function b64UrlDecode(str){
  try{
    str = str.replace(/-/g,'+').replace(/_/g,'/');
    while(str.length % 4) str += '=';
    return JSON.parse(decodeURIComponent(escape(atob(str))));
  }catch(e){ return null; }
}
function makeQR(text, size){
  if(typeof qrcode === 'undefined') return '';
  try{
    const qr = qrcode(0,'M'); qr.addData(text); qr.make();
    const N = qr.getModuleCount(); const cell = size / N;
    let rects = '';
    for(let r=0;r<N;r++) for(let c=0;c<N;c++){
      if(qr.isDark(r,c)) rects += '<rect x="'+(c*cell)+'" y="'+(r*cell)+'" width="'+(cell+0.5)+'" height="'+(cell+0.5)+'" fill="#0F1B3D"/>';
    }
    return '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'" shape-rendering="crispEdges">'+rects+'</svg>';
  }catch(e){ return ''; }
}

/* ============ CEFR MA'LUMOT ============ */
const CEFR_INFO = {

  }
};

const NEXT_STEP_ADVICE = {
  'C2': 'Sizda mukammal daraja! IELTS bandingizni saqlash uchun har hafta 1 soat kitob va podkast bilan mashq qiling.',
  'C1': 'C2 ga chiqish uchun: akademik yozuv (Task 2 esse) va Speaking Part 3 dagi murakkab mavzularda mashq qiling. Kuniga 20 daqiqa yetadi.',
  'B2': 'C1 ga chiqish uchun: Writing va Speaking mezonlarini oshiring. WordDrop\'da 30 kunlik intensiv mashq bilan 0.5 ball qo\'shishingiz mumkin.',

/* ============ MAIN ============ */
(function(){
  const path = window.location.pathname;
  const serialMatch = path.match(/\/verify\/([^\/\?]+)/);
  let serial = serialMatch ? serialMatch[1] : null;
  const params = new URLSearchParams(window.location.search);
  const dataParam = params.get('d');

  if(!serial && !dataParam){
    renderError('Sertifikat topilmadi', 'URL da sertifikat ma\'lumotlari mavjud emas. Iltimos, QR kodni sertifikatdan yana bir bor skanerlab ko\'ring.', path);
    return;
  }

  if(!dataParam){
    renderError('Sertifikat ma\'lumotlari yo\'q', 'Ushbu havolada faqat seriya raqami mavjud, lekin ballar ma\'lumoti yo\'q.', serial);
    return;
  }

  const decoded = b64UrlDecode(dataParam);
  if(!decoded || decoded.o == null){
    renderError('Ma\'lumot buzilgan', 'Sertifikat ma\'lumotlari o\'qib bo\'lmadi.', serial);
    return;
  }

  /* Ingliz detektivi tasdiqnomasi — alohida tarmoq, seriya xuddi shu xesh bilan */
  if(decoded.t==='det'){
    const ini2=String(decoded.n||'X').split(/\s+/).map(w=>w[0]||'').join('').toUpperCase().slice(0,3).padEnd(3,'X');
    const y2=new Date(decoded.d||Date.now()).getFullYear(); let h2=2166136261>>>0; const s2=(decoded.n||'X')+(decoded.d||Date.now());
    for(let i=0;i<s2.length;i++){ h2^=s2.charCodeAt(i); h2=Math.imul(h2,16777619)>>>0; }
    const exp2='WD-DET-'+y2+'-'+ini2+'-'+String(h2%999999).padStart(6,'0');
    if(serial && serial!==exp2){ renderError('Seriya raqami mos kelmadi', 'Ushbu havoladagi seriya raqami va natijalar bir-biriga mos emas — tasdiqnoma o\'zgartirilgan yoki soxta bo\'lishi mumkin.', serial); return; }
    renderDetCert(Object.assign({},decoded,{serial:exp2})); return;
  }

  /* `?d=` ichidagi ma'lumotlardan seriya raqamini qayta hisoblaymiz va
     URL yo'lidagi seriya bilan solishtiramiz — aks holda ballarni
     istalgan seriya ostida ko'rsatish mumkin bo'lib qolardi. */
  const ini = String(decoded.n || 'X').split(/\s+/).map(w=>w[0]||'').join('').toUpperCase().slice(0,3).padEnd(3,'X');
  const y = new Date(decoded.d || Date.now()).getFullYear();
  let h = 2166136261 >>> 0;
  const s = (decoded.n || 'X') + (decoded.d || Date.now());
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  const expectedSerial = 'WD-'+y+'-'+ini+'-'+String(h % 999999).padStart(6,'0');

  if(!serial){
    serial = expectedSerial;
  } else if(serial !== expectedSerial){
    renderError('Seriya raqami mos kelmadi', 'Ushbu havoladagi seriya raqami va ballar ma\'lumotlari bir-biriga mos emas — sertifikat o\'zgartirilgan yoki soxta bo\'lishi mumkin.', serial);
    return;
  }

  renderCert({
    name: decoded.n || 'Candidate',
    l: decoded.l ?? 0, r: decoded.r ?? 0, w: decoded.w ?? 0, s: decoded.s ?? 0,
    overall: decoded.o,
    cefr: bandCEFR(decoded.o),
    date: decoded.d || Date.now(),
    serial: serial,
    signatoryRole: "Bosh Examiner · WordDrop Studio"
  });
})();

          <div class="cdisc"><b>Muhim:</b> Ushbu tasdiqnoma <b>WordDrop</b> ilovasidagi <b>Ingliz detektivi</b> mashq dasturi natijasidir. U rasmiy til sertifikati emas.</div></div>

  const cb=document.getElementById('detCopy'); if(cb) cb.addEventListener('click',()=>{ try{ navigator.clipboard.writeText(window.location.href); cb.querySelector('span').textContent='Nusxa olindi'; }catch(e){} });

/* ============ BAND NUMBER COUNTER ============ */
function animateBandNumber(target){
  const el = document.getElementById('bandNum');
  if(!el) return;
  const [whole, dec] = target.toFixed(1).split('.');
  const start = 0, end = parseFloat(target.toFixed(1));
  const dur = 800;
  const t0 = performance.now();
  function tick(now){
    const p = Math.min(1, (now - t0)/dur);
    const eased = 1 - Math.pow(1 - p, 3); // easeOutCubic
    const cur = (start + (end - start) * eased);
    const [w, d] = cur.toFixed(1).split('.');
    el.innerHTML = `${w}<span class="dec">.${d}</span>`;
    if(p < 1) requestAnimationFrame(tick);
    else el.innerHTML = `${whole}<span class="dec">.${dec}</span>`;
  }
  requestAnimationFrame(tick);
}

function animateModuleBars(){
  document.querySelectorAll('.cmod .bar i').forEach(el=>{
    const w = el.getAttribute('data-w');
    if(w) el.style.width = w + '%';
  });
}

/* ============ CONFETTI ============ */
function fireConfetti(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.width = window.innerWidth * dpr;
  const H = canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.scale(dpr, dpr);

  const colors = ['#2F6FED','#8FB4F8','#0F1B3D','#0E8F60','#E4E4DC'];
  const N = 80;
  const parts = [];
  for(let i=0;i<N;i++){
    parts.push({
      x: window.innerWidth * (0.2 + Math.random()*0.6),
      y: -20 - Math.random()*100,
      vx: (Math.random() - 0.5) * 2,
      vy: 2 + Math.random() * 3,
      w: 6 + Math.random()*5,
      h: 8 + Math.random()*6,
      rot: Math.random() * Math.PI * 2,
      vRot: (Math.random() - 0.5) * 0.15,
      color: colors[Math.floor(Math.random()*colors.length)],
      shape: Math.random() > 0.5 ? 'rect' : 'circle'
    });
  }

  const t0 = performance.now();
  const dur = 3500;

  function tick(now){
    const elapsed = now - t0;
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

    parts.forEach(p=>{
      p.vy += 0.05; // gravity
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vRot;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.max(0, 1 - elapsed/dur);
      if(p.shape === 'rect') ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      else{ ctx.beginPath(); ctx.arc(0,0,p.w/2,0,Math.PI*2); ctx.fill(); }
      ctx.restore();
    });

    if(elapsed < dur){
      requestAnimationFrame(tick);
    }else{
      canvas.classList.add('fade');
      setTimeout(()=>{ ctx.clearRect(0,0,window.innerWidth,window.innerHeight); }, 1500);
    }
  }
  requestAnimationFrame(tick);
}

/* ============ TOAST ============ */
function showToast(msg){

}

function scaleCert(){
  const w = Math.min(window.innerWidth - 32, 1180);
  const sc = Math.min(1, w / 1123);

}
