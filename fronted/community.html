<!DOCTYPE html>
<html lang="uz">
<head>

<title>Jamoa — WordDrop</title>
<meta name="description" content="WordDrop Jamoa: do'stlar va sinf bilan birga ingliz tilini o'rganing.">
<meta name="robots" content="noindex">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --b9:#0B2E8A;--b7:#1B4FCB;--b6:#2F6FED;--b5:#4C87FF;--b1:#E8F0FF;--b0:#F4F8FF;
  --i9:#12172B;--i7:#31384F;--i5:#5C6578;--i3:#A6ADBC;
  --line:#E5E9F2;--sur:#FFFFFF;--bg:#F6F8FC;--sur2:#F6F8FC;
  --ok:#1FAE6B;--ok-bg:#E7F8EF;--bad:#D93A41;--bad-bg:#FCEAEB;--amber:#B97F0E;--amber-bg:#FFF4DC;
  --sh1:0 1px 2px rgba(18,23,43,.04),0 8px 24px rgba(18,23,43,.06);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --disp:'Bricolage Grotesque','Inter',sans-serif;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
body.dark{
  --i9:#EDF0F7;--i7:#C4CAD8;--i5:#9AA3B6;--i3:#5A6273;
  --line:#2A3145;--sur:#1A2032;--bg:#0F1420;--sur2:#141A2A;
  --b1:#1C2740;--b0:#141C2E;--b6:#4C87FF;--b7:#6E9BFF;
  --ok:#34D399;--ok-bg:#12352A;--bad:#F87171;--bad-bg:#3A1E22;--amber:#F2C14E;--amber-bg:#3A2E14;
  --sh1:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--i9);-webkit-font-smoothing:antialiased;line-height:1.5;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--b6);text-decoration:none}
:focus-visible{outline:2.5px solid var(--b6);outline-offset:2px;border-radius:10px}
.wrap{overflow-wrap:anywhere;max-width:560px;margin:0 auto;padding:0 16px calc(32px + var(--safe-b))}

/* Top bar */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + var(--safe-t)) 16px 10px;display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto}
.top h1{flex:1;min-width:0;font-size:16px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:22px;border:none;background:var(--sur);box-shadow:var(--sh1);display:inline-flex;align-items:center;justify-content:center;color:var(--i9);flex:none}
.ib svg{width:20px;height:20px}
.ib.ghost{background:transparent;box-shadow:none}
.spacer{width:44px;flex:none}

/* Type */
.h-xl{font-family:var(--disp);font-weight:800;font-size:30px;line-height:1.08;letter-spacing:-.8px}
.h-l{font-family:var(--disp);font-weight:800;font-size:22px;line-height:1.15;letter-spacing:-.4px}
.h-m{font-family:var(--disp);font-weight:800;font-size:18px;letter-spacing:-.2px}
.muted{color:var(--i5)}
.small{font-size:13px}
.sec{margin-top:26px}
.sec>.h-m{margin:0 4px 10px}

/* Surfaces */
.card{background:var(--sur);border-radius:20px;box-shadow:var(--sh1);padding:16px}
.list{background:var(--sur);border-radius:20px;box-shadow:var(--sh1);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:56px;width:100%;border:none;background:none;text-align:left;color:inherit}
.row+.row{border-top:1px solid var(--line)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;font-size:15px}
.row .s{font-size:13px;color:var(--i5)}
.chev{width:18px;height:18px;color:var(--i3);flex:none}

/* Buttons */
.btn{height:52px;padding:0 22px;border-radius:26px;border:none;font-weight:600;font-size:15.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s ease,opacity .15s ease}
.btn:active{transform:scale(.98)}
.btn-p{background:var(--b6);color:#fff}
.btn-s{background:var(--sur);color:var(--i9);box-shadow:var(--sh1)}
.btn-d{background:var(--bad-bg);color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:default;transform:none}
.btn.block{width:100%}
.btn.sm{height:40px;padding:0 16px;font-size:14px;border-radius:20px}
.link{border:none;background:none;color:var(--b6);font-weight:600;font-size:14px;padding:8px 0}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;font-size:12.5px;font-weight:600;background:var(--b1);color:var(--b7);white-space:nowrap}
.pill.grey{background:var(--sur2);color:var(--i7);border:1px solid var(--line)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--amber-bg);color:var(--amber)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}

/* Notice */
.note{border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.45;display:flex;gap:10px;align-items:flex-start}
.note svg{width:18px;height:18px;flex:none;margin-top:1px}
.note.info{background:var(--b1);color:var(--i9)}
.note.warn{background:var(--amber-bg);color:var(--i9)}
.note.bad{background:var(--bad-bg);color:var(--i9)}
.note.ok{background:var(--ok-bg);color:var(--i9)}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field label{font-size:13.5px;font-weight:600;color:var(--i7)}
.inp{height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--sur);padding:0 14px;font-size:15.5px;width:100%}
textarea.inp{height:auto;min-height:120px;padding:12px 14px;line-height:1.45;resize:vertical}
.inp:focus{outline:none;border-color:var(--b6)}
.inp::placeholder{text-transform:none;letter-spacing:normal;font-weight:400;color:var(--i5)}
.counter{font-size:12.5px;color:var(--i5);text-align:right}
.counter.bad{color:var(--bad)}
.check{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:16px;background:var(--sur);box-shadow:var(--sh1);font-size:14.5px;line-height:1.4;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--b6);flex:none;margin-top:1px}

/* Emblem */
.emb{width:56px;height:56px;border-radius:17px;background:var(--b6);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.emb svg{width:28px;height:28px;fill:#fff}
.emb img{width:100%;height:100%;object-fit:cover}
.emb.sm{width:40px;height:40px;border-radius:12px}
.emb.sm svg{width:20px;height:20px}
.emb.lg{width:72px;height:72px;border-radius:22px}
.emb.lg svg{width:36px;height:36px}
.emb-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.emb-opt{aspect-ratio:1;border-radius:16px;border:2px solid transparent;background:var(--sur);box-shadow:var(--sh1);display:flex;align-items:center;justify-content:center}
.emb-opt svg{width:26px;height:26px;fill:var(--i7)}
.emb-opt[aria-pressed="true"]{border-color:var(--b6);background:var(--b1)}
.emb-opt[aria-pressed="true"] svg{fill:var(--b6)}

/* Avatar */
.av{width:40px;height:40px;border-radius:20px;background:var(--b1);color:var(--b7);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none}

/* Goal bar */
.goal-num{font-family:var(--disp);font-weight:800;font-size:44px;letter-spacing:-1.5px;line-height:1}
.seg{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;background:var(--b1)}
.seg span{height:100%;transition:width .5s ease}

/* Test */
.prog{display:flex;gap:3px}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--b6)}
.q-prompt{font-family:var(--disp);font-weight:600;font-size:21px;line-height:1.32;letter-spacing:-.2px;margin-top:12px}
.opt{display:flex;gap:12px;align-items:center;background:var(--sur);border-radius:18px;padding:12px 10px 12px 16px;box-shadow:var(--sh1);border:2px solid transparent;transition:border-color .15s}
.opt.best{border-color:var(--b6)}
.opt.worst{border-color:var(--i7)}
.opt p{flex:1;font-size:14.5px;line-height:1.42}
.opt .mk{display:flex;flex-direction:column;gap:6px;flex:none}
.mkb{width:44px;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--sur);color:var(--i5);display:flex;align-items:center;justify-content:center}
.mkb svg{width:18px;height:18px}
.mkb.on-best{background:var(--b6);border-color:var(--b6);color:#fff}
.mkb.on-worst{background:var(--i7);border-color:var(--i7);color:var(--sur)}
.legend{display:flex;gap:18px;justify-content:center;font-size:12.5px;color:var(--i5)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:5px;display:block}

/* Docs */
.doc h2{font-family:var(--disp);font-weight:800;font-size:18px;margin:26px 0 8px;letter-spacing:-.2px}
.doc p{font-size:15px;line-height:1.6;margin:8px 0;color:var(--i9)}
.doc ol{margin:8px 0 8px 22px;font-size:15px;line-height:1.6}
.doc .art{position:relative}
.doc .rep{display:inline-flex;align-items:center;gap:4px;border:none;background:none;color:var(--b6);font-size:12.5px;font-weight:600;padding:4px 0}
.summary{font-size:15.5px;line-height:1.55;color:var(--i7)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,25,.45);z-index:60;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:560px;margin:0 auto;background:var(--bg);border-radius:24px 24px 0 0;padding:10px 16px calc(20px + var(--safe-b));max-height:88vh;overflow:auto;transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.radio-row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--sur);border:1.5px solid var(--line);font-size:14.5px;cursor:pointer}
.radio-row input{width:20px;height:20px;accent-color:var(--b6);flex:none}
.radio-row:has(input:checked){border-color:var(--b6);background:var(--b0)}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translate(-50%,20px);background:var(--i9);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;z-index:80;opacity:0;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Misc */
.stack{display:flex;flex-direction:column;gap:10px}
.hr{display:flex;gap:10px;align-items:center}
.skel{height:80px;border-radius:20px;background:linear-gradient(90deg,var(--sur) 0%,var(--sur2) 50%,var(--sur) 100%);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.req{display:flex;gap:12px;align-items:center;padding:12px 0}
.req+.req{border-top:1px solid var(--line)}
.req .dot{width:26px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none}
.req .dot.y{background:var(--ok-bg);color:var(--ok)}
.req .dot.n{background:var(--sur2);color:var(--i5);border:1px solid var(--line)}
.req .dot svg{width:15px;height:15px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:var(--sur);font-size:14px;font-weight:600;white-space:nowrap;color:var(--i7)}
.tab[aria-selected="true"]{background:var(--i9);color:var(--bg);border-color:var(--i9)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px}
.kv dt{color:var(--i5)}
.qa{border-top:1px solid var(--line);padding:12px 0}
.qa:first-child{border-top:none}
.ans{display:inline-flex;gap:4px;align-items:center;font-size:12.5px;font-weight:600;border-radius:8px;padding:2px 8px}
.ans.m{background:var(--ok-bg);color:var(--ok)}
.ans.x{background:var(--bad-bg);color:var(--bad)}
.rate{display:flex;gap:6px;margin-top:8px}
.rate button{width:44px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--sur);font-weight:700}
.rate button[aria-pressed="true"]{background:var(--b6);color:#fff;border-color:var(--b6)}
.code{font-family:var(--disp);font-weight:800;font-size:30px;letter-spacing:4px}
.empty{text-align:center;padding:28px 12px;color:var(--i5);font-size:14.5px}
.center{text-align:center}

/* Pastki menyu (app.html bilan bir xil) */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--sur);border-top:1px solid var(--line);padding:8px 6px calc(8px + var(--safe-b))}
#tabbar .in{display:flex;max-width:560px;margin:0 auto}
.tab-btn{flex:1;border:none;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px 4px;color:var(--i5);border-radius:14px;transition:color .18s;text-decoration:none;min-height:52px}
.tab-btn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s cubic-bezier(.34,1.6,.5,1)}
.tab-btn[aria-current="page"] svg{transform:translateY(-2px) scale(1.12)}
.tab-btn:active svg{transform:scale(.9)}
.tab-btn span{font-size:10.5px;font-weight:600;letter-spacing:.1px}
.tab-btn[aria-current="page"]{color:var(--b6)}
.tab-btn .dot{width:4px;height:4px;border-radius:50%;background:var(--b6);opacity:0;transform:scale(0);transition:.18s}
.tab-btn[aria-current="page"] .dot{opacity:1;transform:scale(1)}
body.has-tabs .wrap{padding-bottom:calc(104px + var(--safe-b))}
body.has-tabs .toast{bottom:calc(96px + var(--safe-b))}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:calc(18px + var(--safe-t)) 4px 6px}
.page-h h1{font-family:var(--disp);font-weight:800;font-size:30px;letter-spacing:-.8px;line-height:1.05}
.page-h .sub{font-size:14px;color:var(--i5);margin-top:6px}
.switch{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--sur);font-size:13.5px;font-weight:600;color:var(--i7);max-width:180px}
.switch span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.today{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.today .av{width:36px;height:36px;font-size:14px;position:relative}
.today .av.off{background:var(--sur2);color:var(--i3);border:1px dashed var(--line)}
.lead{display:flex;flex-direction:column;align-items:center;text-align:center;padding:36px 12px 8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* ---------- Markdown (faqat kodeks uchun) ---------- */
function md(src, opts = {}) {
  const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const out = []; let list = null;
  for (const line of src.split('\n')) {
    const l = line.trim();
    if (!l) { if (list) { out.push('<ol>' + list.join('') + '</ol>'); list = null; } continue; }
    if (l.startsWith('## ')) { if (list) { out.push('<ol>' + list.join('') + '</ol>'); list = null; } out.push('<h2>' + inline(l.slice(3)) + '</h2>'); continue; }
    const li = l.match(/^\d+\.\s+(.*)$/);
    if (li) { (list = list || []).push('<li>' + inline(li[1]) + '</li>'); continue; }
    if (list) { out.push('<ol>' + list.join('') + '</ol>'); list = null; }
    const art = l.match(/^\*\*(\d\.\d)\./);
    if (art && opts.report) {
      out.push('<div class="art"><p>' + inline(l) + '</p><button class="rep" data-report="' + art[1] + '">Buzilish haqida xabar berish</button></div>');
    } else out.push('<p>' + inline(l) + '</p>');
  }
  if (list) out.push('<ol>' + list.join('') + '</ol>');
  return out.join('');
}

function groupSub(g) {
  const role = { owner: 'Sardor', teacher: "O'qituvchi", member: "A'zo", student: "O'quvchi" }[g.role] || '';
  return (g.kind === 'class' ? 'Sinf' : 'Jamoa') + ', ' + role.toLowerCase() + (g.status === 'active' ? ', ' + g.level + '-daraja' : '');
}
function groupStatusPill(g) {
  if (g.status === 'review') return '<span class="pill warn">Tekshiruvda</span>';
  if (g.status === 'rejected') return '<span class="pill bad">Tuzatish kerak</span>';
  if (g.closing_at) return '<span class="pill grey">Yopilmoqda</span>';
  return '';
}
function leaderBlock(st, kind) {
  const isClass = kind === 'class';
  const title = isClass ? "Sinf ochish (o'qituvchilar uchun)" : 'Jamoa ochish';
  const ownedHere = (st.groups || []).find(g => g.kind === kind && (g.role === 'owner' || g.role === 'teacher'));
  if (ownedHere) return '';
  const app = (st.applications || []).find(a => a.kind === kind);
  const bar = st.barrier?.[kind];
  let body = '';
  if (app && app.status === 'pending') {
    body = `<div class="hr"><span class="pill warn">Ko'rib chiqilmoqda</span><span class="small muted">${fmtDate(app.created_at)} yuborilgan</span></div>
      <p class="small" style="margin-top:10px">Odatda bir necha kun ichida javob beriladi. Natija shu yerda ko'rinadi.</p>`;
    if (isClass) body += `<div style="margin-top:14px;padding:14px;border-radius:16px;background:var(--sur2)">
        <div class="small muted">O'quvchilaringizga shu kodni bering</div>
        <div class="code" style="margin-top:4px">${esc(app.vouch_code)}</div>
        <div class="small" style="margin-top:6px">Tasdiqlar: <b>${app.vouches} / 3</b></div>
        <button class="btn btn-s sm" style="margin-top:10px" data-share-vouch="${esc(app.vouch_code)}">${I.share.replace('<svg', '<svg width="16" height="16"')} Kodni ulashish</button>
      </div>`;
  } else if (app && app.status === 'approved' && !app.group_id) {
    body = `<div class="note ok">${I.check}<div>Arizangiz tasdiqlandi. Endi ${isClass ? 'sinfingizni' : 'jamoangizni'} yarating.</div></div>
      <a class="btn btn-p block" style="margin-top:12px" href="#/create/${kind}">${isClass ? 'Sinf yaratish' : 'Jamoa yaratish'}</a>`;
  } else if (bar === 'forever') {
    body = '<p class="small muted">Kodeks buzilishi sababli bu imkoniyat yopilgan.</p>';
  } else if (bar) {
    body = `${app && app.status === 'rejected' && app.note ? `<div class="note warn">${I.info}<div><b>Ariza rad etildi.</b> ${esc(app.note)}</div></div>` : ''}
      <p class="small muted" style="margin-top:10px">Qayta ariza berish mumkin bo'lgan sana: <b>${fmtDate(bar)}</b>.</p>`;
  } else if (isClass && !st.eligible) {
    body = `<p class="small muted">Sinf 30 tagacha o'quvchini sig'diradi. U ham yuqoridagi shartlar bajarilgach ochiladi, keyin 3 ta o'quvchingiz sizni tasdiqlaydi.</p>`;
  } else {
    const info = st.info;
    const okDays = info.days >= 7, okAct = info.active_days >= 5;
    body = `<p class="small muted">${isClass ? "Sinf 30 tagacha o'quvchini sig'diradi. Siz arizani to'ldirasiz, 3 ta o'quvchingiz sizni tasdiqlaydi, so'ng administrator ko'rib chiqadi." : "Jamoa 15 kishigacha bo'ladi. Avval Sardor kodeksi bilan tanishib, qisqa test topshirasiz. Arizani administrator ko'rib chiqadi."}</p>
      <div style="margin-top:8px" ${isClass ? 'hidden' : ''}>
        <div class="req"><span class="dot ${okDays ? 'y' : 'n'}">${okDays ? I.check : ''}</span><div class="grow small">Ro'yxatdan o'tganingizga 7 kun <span class="muted">(${Math.min(info.days, 7)}/7)</span></div></div>
        <div class="req"><span class="dot ${okAct ? 'y' : 'n'}">${okAct ? I.check : ''}</span><div class="grow small">Kamida 5 kun mashq qilgan bo'lish <span class="muted">(${Math.min(info.active_days, 5)}/5)</span></div></div>
      </div>
      ${app && app.status === 'rejected' && app.note ? `<div class="note warn" style="margin-top:8px">${I.info}<div><b>Oldingi ariza rad etilgan.</b> ${esc(app.note)}</div></div>` : ''}
      <a class="btn ${st.eligible ? 'btn-p' : 'btn-s'} block" style="margin-top:12px" ${st.eligible ? `href="#/apply/${kind}"` : 'aria-disabled="true"'}>${st.eligible ? 'Arizani boshlash' : 'Shartlar bajarilgach ochiladi'}</a>`;
  }
  return `<div class="sec"><h3 class="h-m">${title}</h3><div class="card">${body}</div></div>`;
}
function actionsBlock(st) {
  const acts = st.actions || [];
  if (!acts.length) return '';
  return '<div class="sec"><h3 class="h-m">Menga nisbatan choralar</h3><div class="list">' + acts.map(a => `
    <div class="row" style="align-items:flex-start">
      <div class="grow">
        <div class="t">${esc(ACTION_NAMES[a.action] || a.action)}${a.reverted ? ' <span class="pill ok">Bekor qilingan</span>' : ''}</div>
        <div class="s">${a.group_name ? esc(a.group_name) + ', ' : ''}${esc(articleLabel(a.article))}, ${fmtDate(a.created_at)}${a.until ? ', ' + fmtDate(a.until) + ' gacha' : ''}</div>
        ${a.note ? `<div class="s" style="margin-top:2px">Izoh: ${esc(a.note)}</div>` : ''}
        ${a.appeal_status ? `<div style="margin-top:6px"><span class="pill ${a.appeal_status === 'overturned' ? 'ok' : a.appeal_status === 'upheld' ? 'grey' : 'warn'}">${{ open: "E'tiroz ko'rib chiqilmoqda", upheld: "E'tiroz rad etildi", overturned: "E'tiroz qabul qilindi" }[a.appeal_status]}</span></div>` : ''}
      </div>
      ${a.appealable ? `<button class="btn btn-s sm" data-appeal="${a.id}">E'tiroz</button>` : ''}
    </div>`).join('') + '</div></div>';
}
function articleLabel(a) {
  if (!a) return '';
  const code = a.replace(/^[LM]/, '');

function appealSheet(actionId) {

  });
}
async function shareText(text, url) {
  try { if (navigator.share) { await navigator.share({ text, url }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text + (url ? ' ' + url : '')); toast('Nusxa olindi.'); } catch (e) { toast("Nusxa olib bo'lmadi."); }
}

const DRAFT = (kind) => 'wd_jm_draft_' + kind;
function shuffle(a, seed) { const r = a.slice(); let s = seed; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor(s / 233280 * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }

async function pageApply(kind) {
  const title = kind === 'class' ? 'Sinf arizasi' : 'Sardor arizasi';
  topbar(title); loading();
  const st = await loadStatus();
  if (!st.auth || !st.info.registered) return needAccount("Ariza berish uchun ro'yxatdan o'tgan bo'lishingiz kerak.");
  if (!st.eligible) { location.hash = '#/sardor'; return; }
  const app = (st.applications || []).find(a => a.kind === kind && (a.status === 'pending' || (a.status === 'approved' && !a.group_id)));
  if (app) { location.hash = '#/sardor'; return; }
  if (st.barrier?.[kind]) { location.hash = '#/sardor'; return; }
  if (!st.consent.leader) return consentView('leader', () => pageApply(kind), { title, back: '#/sardor' });

  const qs = await loadQuestions();
  let dr = ls.get(DRAFT(kind));
  if (!dr || dr.v !== 1) dr = { v: 1, idx: -1, seed: Math.floor(Math.random() * 100000) + 1, sjt: {}, open: {} };
  const save = () => ls.set(DRAFT(kind), dr);
  const total = qs.length;
  let shownAt = 0;

  const render = () => {
    window.scrollTo(0, 0);
    if (dr.idx < 0) {
      topbar(title, { back: '#/sardor' });
      view(`<div style="padding:8px 4px 0">
        <p class="small muted">2-qadam: vaziyatli test</p>
        <h2 class="h-xl" style="margin-top:4px">Sardor qanday o'ylaydi?</h2>
        <p class="summary" style="margin-top:12px">16 ta vaziyat va 4 ta ochiq savol. To'g'ri yoki noto'g'ri "tuzoq" yo'q, siz qanday qaror qilishingiz muhim.</p>
        <div class="list" style="margin-top:16px">
          <div class="row"><div class="grow"><div class="t">Vaqt cheklovi yo'q</div><div class="s">O'rtacha 20–30 daqiqa. Shoshilmang.</div></div></div>
          <div class="row"><div class="grow"><div class="t">Javoblar shu qurilmada saqlanadi</div><div class="s">Chiqib ketsangiz, qolgan joydan davom etasiz.</div></div></div>
          <div class="row"><div class="grow"><div class="t">Har vaziyatda ikkita belgi</div><div class="s">Bittasini eng to'g'ri, bittasini eng noto'g'ri deb belgilaysiz.</div></div></div>
          <div class="row"><div class="grow"><div class="t">Natijani administrator ko'radi</div><div class="s">Ochiq javoblarni u shaxsan o'qiydi.</div></div></div>
        </div>
        <button class="btn btn-p block" style="margin-top:18px" id="go">${Object.keys(dr.sjt).length ? 'Davom ettirish' : 'Boshlash'}</button>
      </div>`);
      document.getElementById('go').onclick = () => { dr.idx = Math.max(0, firstUnanswered()); save(); render(); };
      return;
    }
    if (dr.idx >= total) return renderReview();
    const q = qs[dr.idx];
    topbar(title, { back: null, right: `<span class="spacer small muted" style="text-align:right;font-weight:600;line-height:44px">${dr.idx + 1}/${total}</span>` });
    $top.querySelector('.ib').outerHTML = `<button class="ib" id="tExit" aria-label="Testdan chiqish">${I.close}</button>`;
    document.getElementById('tExit').onclick = () => { location.hash = '#/sardor'; toast('Javoblaringiz saqlandi.'); };
    const prog = '<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="' + total + '" aria-valuenow="' + (dr.idx + 1) + '" aria-label="Test jarayoni">' + qs.map((_, i) => '<i class="' + (i <= dr.idx ? 'on' : '') + '"></i>').join('') + '</div>';
    if (q.qtype === 'sjt') {
      const a = dr.sjt[q.id] || {};
      const order = shuffle(q.options.map(o => o.id), dr.seed + q.id);
      const optsById = Object.fromEntries(q.options.map(o => [o.id, o.text]));
      view(`<div style="padding:4px 4px 0">${prog}
        <div style="margin-top:16px"><span class="pill">${esc(q.block)}</span></div>
        <p class="q-prompt">${esc(q.prompt)}</p>
        <p class="small muted" style="margin-top:8px">Bittasini eng to'g'ri, bittasini eng noto'g'ri deb belgilang.</p>
        <div class="stack" style="margin-top:14px">${order.map(id => `
          <div class="opt ${a.best === id ? 'best' : ''} ${a.worst === id ? 'worst' : ''}">
            <p>${esc(optsById[id])}</p>
            <div class="mk">
              <button class="mkb ${a.best === id ? 'on-best' : ''}" data-best="${id}" aria-pressed="${a.best === id}" aria-label="Eng to'g'ri deb belgilash">${I.check}</button>
              <button class="mkb ${a.worst === id ? 'on-worst' : ''}" data-worst="${id}" aria-pressed="${a.worst === id}" aria-label="Eng noto'g'ri deb belgilash">${I.x}</button>
            </div>
          </div>`).join('')}</div>
        <div class="legend" style="margin-top:14px"><span><i style="background:var(--b6)"></i>Eng to'g'ri</span><span><i style="background:var(--i7)"></i>Eng noto'g'ri</span></div>
        <div class="hr" style="margin-top:16px">
          ${dr.idx > 0 ? '<button class="btn btn-s" id="prev">Orqaga</button>' : ''}
          <button class="btn btn-p" id="next" style="flex:1" ${a.best && a.worst ? '' : 'disabled'}>Keyingi</button>
        </div></div>`);
      document.querySelectorAll('[data-best]').forEach(b => b.onclick = () => { const id = b.dataset.best; const cur = dr.sjt[q.id] || {}; dr.sjt[q.id] = { ...cur, best: id, worst: cur.worst === id ? null : cur.worst }; save(); keepTime(q.id); render(); });
      document.querySelectorAll('[data-worst]').forEach(b => b.onclick = () => { const id = b.dataset.worst; const cur = dr.sjt[q.id] || {}; dr.sjt[q.id] = { ...cur, worst: id, best: cur.best === id ? null : cur.best }; save(); keepTime(q.id); render(); });
    } else {
      const v = dr.open[q.id] || '';
      view(`<div style="padding:4px 4px 0">${prog}
        <div style="margin-top:16px"><span class="pill">Ochiq savol</span></div>
        <p class="q-prompt">${esc(q.prompt)}</p>
        <p class="small muted" style="margin-top:8px">O'z so'zlaringiz bilan, aniq misollar bilan yozing. Kamida ${q.min_len} belgi.</p>
        <div class="field"><label for="oa" style="position:absolute;left:-9999px">Javobingiz</label><textarea id="oa" class="inp" style="min-height:220px" maxlength="${q.max_len}">${esc(v)}</textarea><div class="counter" id="oc"></div></div>
        <div class="hr" style="margin-top:14px"><button class="btn btn-s" id="prev">Orqaga</button><button class="btn btn-p" id="next" style="flex:1">Keyingi</button></div></div>`);
      const ta = document.getElementById('oa'), oc = document.getElementById('oc'), nx = document.getElementById('next');
      const upd = () => { const n = ta.value.trim().length; oc.textContent = n + ' / ' + q.max_len + (n < q.min_len ? ' (yana ' + (q.min_len - n) + ')' : ''); oc.classList.toggle('bad', n > 0 && n < q.min_len); nx.disabled = n < q.min_len; dr.open[q.id] = ta.value; save(); };
      ta.oninput = upd; upd();
    }
    shownAt = performance.now();
    const nx = document.getElementById('next'), pv = document.getElementById('prev');
    nx && (nx.onclick = () => { keepTime(q.id); dr.idx++; save(); render(); });
    pv && (pv.onclick = () => { keepTime(q.id); dr.idx--; save(); render(); });
  };
  const keepTime = (qid) => { if (!shownAt) return; const ms = performance.now() - shownAt; shownAt = performance.now(); if (dr.sjt[qid]) { dr.sjt[qid].ms = Math.round((dr.sjt[qid].ms || 0) + ms); save(); } };
  const firstUnanswered = () => { for (let i = 0; i < qs.length; i++) { const q = qs[i]; if (q.qtype === 'sjt' ? !(dr.sjt[q.id]?.best && dr.sjt[q.id]?.worst) : (dr.open[q.id] || '').trim().length < q.min_len) return i; } return qs.length; };
  const renderReview = () => {

    $top.querySelector('.ib').outerHTML = `<button class="ib" id="tBack" aria-label="Oxirgi savolga qaytish">${I.back}</button>`;
    document.getElementById('tBack').onclick = () => { dr.idx = total - 1; save(); render(); };
    const missing = firstUnanswered();
    view(`<div style="padding:8px 4px 0">
      <p class="small muted">3-qadam: yuborish</p>
      <h2 class="h-xl" style="margin-top:4px">${missing < total ? 'Bir nechta javob qolgan' : 'Hammasi tayyor'}</h2>
      <p class="summary" style="margin-top:10px">${missing < total ? (missing + 1) + '-savolga javob berilmagan.' : "Yuborganingizdan keyin javoblarni o'zgartirib bo'lmaydi. Natija Jamoa bosh sahifasida ko'rinadi."}</p>
      ${kind === 'class' ? `<div class="note info" style="margin-top:14px">${I.info}<div>Yuborgach, sizga kod beriladi. Uni 3 ta ro'yxatdan o'tgan o'quvchingizga bering: ular Jamoa bo'limida kodni kiritib, sizni tasdiqlaydi.</div></div>` : ''}
      ${missing < total ? `<button class="btn btn-p block" style="margin-top:18px" id="fix">Javob berilmagan savolga o'tish</button>` : `<button class="btn btn-p block" style="margin-top:18px" id="send">Arizani yuborish</button>`}
    </div>`);
    const fx = document.getElementById('fix'); fx && (fx.onclick = () => { dr.idx = missing; save(); render(); });
    const sd = document.getElementById('send');
    sd && (sd.onclick = async () => {
      sd.disabled = true; sd.textContent = 'Yuborilmoqda…';
      const payload = { sjt: {}, open: {} };
      for (const q of qs) {

        view(`<div style="padding:28px 4px 0" class="center">
          <div class="emb lg" style="margin:0 auto">${I.check.replace('stroke="currentColor"', 'stroke="#fff"')}</div>
          <h2 class="h-xl" style="margin-top:18px">Ariza yuborildi</h2>

          ${r.vouch_code ? `<div class="card" style="margin-top:18px"><div class="small muted">O'quvchilaringiz uchun kod</div><div class="code" style="margin-top:4px">${esc(r.vouch_code)}</div><div class="small muted" style="margin-top:6px">3 ta o'quvchi tasdiqlagach, arizangiz ko'rib chiqiladi.</div></div>` : ''}
          <a class="btn btn-p block" style="margin-top:18px" href="#/sardor">Sardorlik bo'limiga</a></div>`);
      } catch (e) { sd.disabled = false; sd.textContent = 'Arizani yuborish'; toast(errText(e)); }
    });
  };
  render();
}

    } catch (err) { b.disabled = false; toast(errText(err)); }

}
function shrink(file, size) {
  return new Promise((res, rej) => {
    if (file.size > 5 * 1024 * 1024) return rej(new Error('too_big'));
    const img = new Image(); const u = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(img.width, img.height); const c = document.createElement('canvas'); c.width = c.height = size;
      c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
      URL.revokeObjectURL(u); c.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/jpeg', 0.86);
    };
    img.onerror = rej; img.src = u;
  });
}

function adminApp(a, keys, qById) {
  const f = a.flags || {}; const red = f.red || [];
  const os = a.open_scores || {}; const osTot = Object.values(os).reduce((s, x) => s + x, 0);
  const verdict = a.score >= 45 ? ['ok', 'Kuchli'] : a.score >= 32 ? ['warn', "Diqqat bilan o'qing"] : ['bad', 'Past'];
  const sjt = Object.keys(a.answers?.sjt || {}).sort((x, y) => x - y).map(id => {
    const ans = a.answers.sjt[id], k = keys[id], q = qById[id]; if (!k || !q) return '';
    const text = (oid) => esc((q.options.find(o => o.id === oid) || {}).text || oid);
    return `<div class="qa"><div class="small muted">${id}. ${esc(k.measures)}${ans.ms != null && ans.ms < 5000 ? ' <span class="ans x">tez: ' + (ans.ms / 1000).toFixed(1) + ' s</span>' : ''}</div>
      <div style="margin-top:4px;font-size:14px">${esc(q.prompt)}</div>
      <div style="margin-top:6px;font-size:13.5px"><span class="ans ${ans.best === k.best ? 'm' : 'x'}">Eng to'g'ri: ${ans.best}</span> ${text(ans.best)}${red.includes(+id) ? ' <span class="ans x">qizil bayroq</span>' : ''}</div>
      <div style="margin-top:4px;font-size:13.5px"><span class="ans ${ans.worst === k.worst ? 'm' : 'x'}">Eng noto'g'ri: ${ans.worst}</span> ${text(ans.worst)}</div>
      ${ans.best !== k.best || ans.worst !== k.worst ? `<div class="small muted" style="margin-top:4px">Kalit: eng to'g'ri ${k.best}, eng noto'g'ri ${k.worst}</div>` : ''}</div>`;
  }).join('');
  const open = Object.keys(a.answers?.open || {}).sort((x, y) => x - y).map(id => `
    <div class="qa"><div class="small muted">${id}. ${esc(qById[id]?.prompt || '')}</div>
      <p style="margin-top:6px;font-size:14.5px;white-space:pre-wrap">${esc(a.answers.open[id])}</p>
      <div class="rate" role="group" aria-label="${id}-savol bahosi">${[0, 1, 2, 3].map(v => `<button data-rate="${a.id}|${id}|${v}" aria-pressed="${os[id] === v}">${v}</button>`).join('')}</div></div>`).join('');
  return `<div class="card" style="margin-top:10px" data-scores='${esc(JSON.stringify(os))}'>
    <div class="hr" style="justify-content:space-between"><div><div class="h-m">${esc(a.name || 'Ismsiz')}</div><div class="small muted">${esc(a.email || '')}</div></div><span class="pill">${a.kind === 'class' ? 'Sinf' : 'Jamoa'}</span></div>
    <dl class="kv" style="margin-top:12px">
      <dt>Test bali</dt><dd><b>${a.score} / 64</b> <span class="pill ${verdict[0]}" style="height:22px">${verdict[1]}</span></dd>
      <dt>Ochiq javoblar</dt><dd><b id="os-${a.id}">${osTot} / 12</b></dd>
      <dt>Hisob yoshi</dt><dd>${a.info.days} kun, ${a.info.active_days} kun mashq</dd>
      <dt>Belgilar</dt><dd>${red.length ? '<span class="ans x">qizil bayroq: ' + red.join(', ') + '</span> ' : ''}${f.inconsistent ? '<span class="ans x">9 va 10 zid</span> ' : ''}${f.fast ? '<span class="ans x">' + f.fast + ' ta tez javob</span>' : ''}${!red.length && !f.inconsistent && !f.fast ? 'Yo\'q' : ''}</dd>
      ${a.kind === 'class' ? `<dt>Tasdiqlar</dt><dd>${a.vouches.length} / 3 ${a.vouches.map(v => '<div class="small">' + esc(v.name || v.email) + ', ' + v.info.days + ' kun</div>').join('')}</dd>` : ''}
    </dl>
    <details style="margin-top:12px"><summary style="cursor:pointer;font-weight:600;font-size:14px;padding:6px 0">Vaziyatli javoblar</summary>${sjt}</details>
    <details style="margin-top:6px" open><summary style="cursor:pointer;font-weight:600;font-size:14px;padding:6px 0">Ochiq javoblar (0–3 baholang)</summary>${open}</details>
    <div class="field"><label for="an-${a.id}">Izoh (rad etilsa, nomzod ko'radi)</label><input id="an-${a.id}" class="inp"></div>
    <div class="hr" style="margin-top:12px"><button class="btn btn-d" style="flex:1" data-app="${a.id}" data-ok="0">Rad etish</button><button class="btn btn-p" style="flex:1" data-app="${a.id}" data-ok="1" ${a.kind === 'class' && a.vouches.length < 3 ? 'disabled' : ''}>Tasdiqlash</button></div>
  </div>`;
}

    el.querySelector('#aaGo').onclick = async () => {
      const art = el.querySelector('#aaArt').value; if (!art) return toast('Moddani tanlang.');
      try { await rpc('jm_admin_action', { p_gid: gid, p_target: target, p_action: el.querySelector('input[name=aa]:checked').value, p_article: art, p_note: el.querySelector('#aaNote').value.trim() || null, p_days: +el.querySelector('#aaDays').value || 30 }); closeSheet(); toast('Chora qo\'llandi.'); pageAdmin(); } catch (e) { toast(errText(e)); }
    };
  });
}

/* ---------- Router ---------- */
async function route() {
  closeSheet();
  const h = location.hash.replace(/^#/, '') || '/';
  const p = h.split('/').filter(Boolean);
  try {
    if (!p.length) return await pageTeam();
    if (p[0] === 'azolar') return await pageMembers();
    if (p[0] === 'devor') return await pageWall();
    if (p[0] === 'sardor') return await pageLeader();
    if (p[0] === 'men') return await pageMe();
    tabbar(null);
    if (p[0] === 'kodeks' && (p[1] === 'leader' || p[1] === 'member')) return await pageCodex(p[1]);
    if (p[0] === 'apply' && (p[1] === 'team' || p[1] === 'class')) return await pageApply(p[1]);
    if (p[0] === 'create' && (p[1] === 'team' || p[1] === 'class')) return await pageCreate(p[1]);
    if (p[0] === 'join' && p[1]) return await pageJoin(p[1].toUpperCase());
    if (p[0] === 'admin') return await pageAdmin();
    if (p[0] === 'g' && p[1]) {
      if (p[2] === 'kodeks' && (p[3] === 'leader' || p[3] === 'member')) return await pageCodex(p[3], p[1]);
      if (p[2] === 'edit') return await pageCreate(null, p[1]);
      ls.set('wd_jm_cur', p[1]); location.replace('#/'); return;
    }
    location.hash = '#/';
  } catch (e) { tabbar(null); failView(e); }
}

// /g/KOD havolasi (Cloudflare _redirects orqali shu sahifa ochiladi)
const pm = location.pathname.match(/^\/g\/([A-Za-z0-9]{6})\/?$/);
if (pm) history.replaceState(null, '', '/community.html#/join/' + pm[1].toUpperCase());
else { try { const pj = sessionStorage.getItem('wd_jm_pending_join'); if (pj && (!location.hash || location.hash === '#/')) history.replaceState(null, '', '#/join/' + pj); } catch (e) {} }

window.addEventListener('hashchange', route);
let booted = false, lastUid;
sb.auth.onAuthStateChange((ev, session) => {
  const uid = session?.user?.id || null;
  if (booted && uid !== lastUid) { S.status = null; route(); }
  lastUid = uid;
});
sb.auth.getSession().then(({ data }) => { lastUid = data.session?.user?.id || null; booted = true; route(); });
</script>
