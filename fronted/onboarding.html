<html lang="uz">
  <head>

    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"

    <meta name="theme-color" content="#143e39" />
    <title>WordDrop · Shaxsiy o‘quv rejasi</title>
    <link rel="icon" href="favicon.png" />
    <style>
      :root {
        color-scheme: light;
        --ink: #182f2b;
        --muted: #546a60;
        --deep: #143e39;
        --lime: #e0f49c;
        --line: #d4dbd0;
        --paper: #fafbf5;
        font:
          16px/1.5 system-ui,
          sans-serif;
        color: var(--ink);
        background: #edf0e7;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
        color: inherit;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid #af661a;
        outline-offset: 3px;
      }
      header,
      .layout {
        max-width: 1160px;
        margin: auto;
      }
      header {
        height: 84px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 22px;
        letter-spacing: -1px;
        font-weight: 800;
      }
      .brand img {
        width: 34px;
        border-radius: 11px;
      }
      .brand span {
        color: #477968;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(250px, 0.75fr) minmax(0, 1.5fr);
        padding: 0 28px 44px;
        gap: 18px;
        align-items: start;
      }
      .side,
      main {
        border-radius: 22px;
      }
      .side {
        background: var(--deep);
        color: #fff;
        padding: 32px 28px;
        position: sticky;
        top: 16px;
        overflow: hidden;
      }
      .side h2,
      h1 {
        font-family: Georgia, serif;
        font-weight: 500;
        letter-spacing: -0.045em;
        line-height: 1.07;
      }
      .side h2 {
        font-size: 39px;
        margin: 0 0 24px;
      }
      .side h2 em {
        color: var(--lime);
        font-weight: 400;
      }
      .route {
        padding: 0;
        list-style: none;
      }
      .route li {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #b1c9c0;
        padding: 9px 0;
      }
      .route li:before {
        content: "";
        width: 9px;
        height: 9px;
        border: 1px solid #b1c9c0;
        border-radius: 50%;
      }
      .route .active {
        color: white;
        font-weight: 700;
      }
      .route .active:before,
      .route .done:before {
        background: var(--lime);
        border-color: var(--lime);
      }
      .snapshot {
        border-top: 1px solid #52726a;
        margin-top: 24px;
        padding-top: 18px;
        color: #deebe6;
      }
      .snapshot strong {
        display: block;
        color: var(--lime);
        font-size: 24px;
      }
      .eyebrow {
        font-size: 12px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        font-weight: 750;
        color: var(--muted);
      }
      main {
        background: var(--paper);
        border: 1px solid var(--line);
        padding: clamp(22px, 4vw, 52px);
      }
      progress {
        display: block;
        width: 100%;
        height: 5px;
        accent-color: #468260;
        border: 0;
        margin: 10px 0 26px;
        border-radius: 4px;
        overflow: hidden;
      }
      progress::-webkit-progress-bar {
        background: #e3e8dc;
      }
      progress::-webkit-progress-value {
        background: #45785a;
      }
      h1 {
        font-size: clamp(34px, 4.1vw, 53px);
        margin: 0 0 12px;
      }
      p {
        margin: 6px 0 20px;
        color: var(--muted);
      }
      fieldset {
        padding: 0;
        border: 0;
        margin: 22px 0 0;
        min-width: 0;
      }
      legend,
      .field {
        font-weight: 690;
        margin-bottom: 8px;
      }
      .field {
        display: block;
        margin-top: 18px;
      }
      input[type="text"],
      select {
        display: block;
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #aab8ab;
        background: white;
        border-radius: 9px;
        color: var(--ink);
      }
      .choices {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }
      .opt {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 11px;
        padding: 13px;
        cursor: pointer;
      }
      .opt:has(input:checked) {
        background: #edf4da;
        border-color: #587b48;
      }
      .opt input {
        accent-color: var(--deep);
        margin: 5px 0 0;
        flex-shrink: 0;
      }
      .opt b {
        display: block;
        font-size: 15px;
      }
      .opt small {
        display: block;
        color: var(--muted);
        line-height: 1.4;
        margin-top: 3px;
      }
      .actions {
        border-top: 1px solid var(--line);
        margin-top: 26px;
        padding-top: 19px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .primary,
      .secondary {
        border-radius: 9px;
        padding: 12px 19px;
        font-weight: 700;
        border: 1px solid var(--line);
        background: white;
      }
      .primary {
        background: var(--deep);
        color: white;
        border-color: var(--deep);
        margin-left: auto;
      }
      .primary:disabled {
        opacity: 0.6;
      }
      .notice {
        color: #8b3a18;
        margin-top: 14px;
      }
      .lesson {
        background: #edf3df;
        border-radius: 13px;
        padding: 18px 20px;
      }
      .lesson li {
        padding: 7px 0;
      }
      .lesson ol {
        padding-left: 22px;
        margin-bottom: 0;
      }
      .lesson h2 {
        font:
          600 21px Georgia,
          serif;
        margin: 0;
      }
      .facts {
        padding: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        list-style: none;
      }
      .facts li {
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 4px 10px;
        font-size: 14px;
      }
      #skip {
        font-size: 14px;
        font-weight: 650;
      }
      .counts {
        font-variant-numeric: tabular-nums;
      }
      @media (max-width: 730px) {
        header {
          height: 62px;
          padding: 0 16px;
        }
        .layout {
          display: block;
          padding: 0 12px 24px;
        }
        .side {
          position: static;
          padding: 17px 20px;
          border-radius: 15px;
          margin: 0 0 9px;
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 8px;
        }
        .side h2 {
          font-size: 23px;
          margin: 0;
        }
        .route {
          display: none;
        }
        .snapshot {
          border: 0;
          padding: 0;
          margin: 0;
          text-align: right;
          font-size: 12px;
        }
        .snapshot strong {
          font-size: 15px;
        }
        main {
          border-radius: 16px;
          padding: 23px 18px;
        }
        .actions {
          padding-bottom: env(safe-area-inset-bottom);
        }
        .choices {
          gap: 7px;
        }
        .opt {
          padding: 10px;
        }
        .opt b {
          font-size: 14px;
        }
      }
      @media (max-width: 365px) {
        .choices {
          grid-template-columns: 1fr;
        }
      }
      .portrait {
        height: 175px;
        margin: 8px -28px -32px;
        background:
          linear-gradient(0deg, rgba(20, 62, 57, 0.15), transparent),
          url("speaking-cards/practice/01.jpg") 96% 60% / 236% auto no-repeat;
      }
      .snapshot {
        padding-bottom: 18px;
      }
      .lesson li::marker {
        color: #416541;
        font-weight: bold;
      }
      @media (max-width: 730px) {
        .portrait {
          display: none;
        }
        .snapshot {
          padding-bottom: 0;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <img src="favicon.png" alt="" />
        <div>Word<span>Drop</span></div>
      </div>
      <button id="skip" class="secondary" type="button">Tezkor reja</button>
    </header>
    <div class="layout">
      <aside class="side">
        <div>
          <h2>O‘quv <em>rejangiz</em></h2>
          <ol class="route" id="route"></ol>
        </div>
        <div class="snapshot" id="snapshot"></div>
        <div class="portrait" aria-hidden="true"></div>
      </aside>
      <main>
        <div id="counter" class="eyebrow counts"></div>
        <progress
          id="progress"
          max="5"
          value="1"
          aria-label="Bosqich"
        ></progress>
        <form id="form">
          <h1 id="title" tabindex="-1"></h1>
          <p id="intro"></p>
          <div id="fields"></div>
          <div id="notice" class="notice" role="status"></div>
          <div class="actions">
            <button type="button" class="secondary" id="back">← Ortga</button
            ><button id="next" class="primary" type="submit">
              Davom etish →
            </button>
          </div>
        </form>
      </main>
    </div>
    <script>
      const $ = (id) => document.getElementById(id);
      const read = (key, otherwise) => {
        try {
          return JSON.parse(localStorage.getItem(key)) ?? otherwise;
        } catch {
          return otherwise;
        }
      };
      const write = (key, value) => {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch {}
      };
      const profile = read("wd_profile_v3", {}),
        survey = (profile.studyPlan ??= {});
      const labels = [
        "Maqsad",
        "Daraja",
        "Mashq turi",
        "Jadval",
        "Shaxsiy reja",
      ];
      const intro = [
        "Qaysi vaziyat uchun ingliz tilini o‘rganyapsiz?",
        "Hozir ingliz tilida nimalar qila olasiz?",
        "Birinchi darsda qaysi ko‘nikmani mashq qilasiz?",
        "Bir haftaga qanday vaqt ajrata olasiz?",
        "Birinchi mashg‘ulotingiz tayyor.",
      ];
      const desc = [
        "Javobingizga qarab mashq vaziyatini tanlaymiz.",
        "O‘zingizga eng yaqin ta’rifni tanlang. Bu boshlang‘ich taxmin.",
        "Tanlagan ko‘nikmangiz va mavzuingiz birinchi mashqqa asos bo‘ladi.",
        "Sizga qulay yuklamani tanlang. Uni keyin o‘zgartirishingiz mumkin.",
        "Rejani ko‘rib chiqing. Istalgan javobni Ortga orqali tahrirlashingiz mumkin.",
      ];
      const goals = [
        ["ielts", "Imtihonga tayyorlanish", "IELTS yoki Multilevel"],
        ["work", "Ish va kasb", "Suhbat, uchrashuv va yozishma"],
        ["travel", "Sayohat", "Yo‘l so‘rash va xizmatlardan foydalanish"],
        ["movies", "Film va musiqa", "Dialog va qo‘shiq matnlarini tushunish"],
        [
          "general",
          "Kundalik muloqot",
          "Fikrni aytish va suhbatni davom ettirish",
        ],
      ];
      const levels = [
        ["A1", "A1 · Boshlanish", "O‘zimni sodda gaplar bilan tanishtiraman."],
        [
          "A2",
          "A2 · Kundalik til",
          "Xarid yoki oilam haqida qisqa suhbatlashaman.",
        ],
        ["B1", "B1 · Mustaqil", "Voqeani aytib, fikrimga sabab keltiraman."],
        [
          "B2",
          "B2 · Erkin muloqot",
          "Ikki fikrni solishtirib, dalil keltiraman.",
        ],
        [
          "C1",
          "C1 · Ilg‘or",
          "Murakkab mavzuda aniq va mos uslubda gapiraman.",
        ],
        ["C2", "C2 · Mahorat", "Nozik ma’no va ohang farqlarini ifodalayman."],
        ["unknown", "Hali bilmayman", "Yengil mashqdan boshlayman."],
      ];
      const skills = [
        ["speaking", "Gapirish"],
        ["listening", "Tinglash"],
        ["reading", "O‘qish"],
        ["writing", "Yozish"],
      ];
      const blockers = {
        speaking: [
          [
            "start",
            "Gapni boshlash",
            "Avval “In my view…” bilan fikringizni boshlab ko‘ring.",
          ],
          [
            "flow",
            "Fikrni davom ettirish",
            "Sabab va misolni “because” va “for example” bilan ulang.",
          ],
        ],
        listening: [
          [
            "speed",
            "Tez nutq",
            "Bir jumlani ikki marta tinglab, eshitganingizni takrorlang.",
          ],
          [
            "details",
            "Tafsilotlarni ilg‘ash",
            "Ikkinchi tinglashda vaqt, joy yoki sonni yozib oling.",
          ],
        ],
        reading: [
          [
            "words",
            "Notanish so‘zlar",
            "Bitta so‘zning ma’nosini avval kontekstdan taxmin qiling.",
          ],
          [
            "idea",
            "Asosiy fikr",
            "Har xatboshiga bir jumlalik sarlavha qo‘ying.",
          ],
        ],
        writing: [
          [
            "structure",
            "Fikrlarni tartiblash",
            "Avval asosiy fikrni, keyin uning sababini yozing.",
          ],
          [
            "accuracy",
            "Grammatik aniqlik",
            "Oxirida har bir gapning egasi va fe’lini tekshiring.",
          ],
        ],
      };
      function challenge() {
        return blockers[survey.skill]
          ? options(
              "challenge",
              "Qaysi jihati qiyinroq? (ixtiyoriy)",
              blockers[survey.skill].map(([v, t]) => [v, t]),
              survey.challenge,
            )
          : "";
      }
      const topics = [
        ["tech", "Texnologiya"],
        ["sport", "Sport"],
        ["music", "Musiqa"],
        ["films", "Kino"],
        ["books", "Kitoblar"],
        ["travel", "Sayohat"],
        ["food", "Taomlar"],
        ["games", "O‘yinlar"],
        ["art", "San’at"],
        ["business", "Biznes"],
        ["science", "Ilm-fan"],
        ["nature", "Tabiat"],
      ];
      const notes = [
        ["daily", "Kunlik eslatma"],
        ["streak", "Seriya eslatmasi"],
        ["weekly", "Haftalik hisobot"],
      ];
      const exam = [
        ["multilevel", "Multilevel"],
        ["ielts", "IELTS"],
        ["later", "Hali tanlamadim"],
      ];
      const nameOf = (items, key) => items.find((x) => x[0] === key)?.[1] || "";
      const escape = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      let step = Math.max(
          0,
          Math.min(4, Number(read("wd_onb_plan_step", 0)) || 0),
        ),
        busy = false;
      function persist() {
        write("wd_profile_v3", profile);
        write("wd_onb_plan_step", step);
      }
      function options(key, title, items, value, multiple = false) {
        const selection = multiple
          ? Array.isArray(value)
            ? value
            : []
          : [value];
        return (
          "<fieldset><legend>" +
          title +
          '</legend><div class="choices">' +
          items
            .map(
              ([v, t, d]) =>
                '<label class="opt"><input type="' +
                (multiple ? "checkbox" : "radio") +
                '" name="' +
                key +
                '" value="' +
                v +
                '" ' +
                (selection.includes(v) ? "checked" : "") +
                "><span><b>" +
                t +
                "</b>" +
                (d ? "<small>" + d + "</small>" : "") +
                "</span></label>",
            )
            .join("") +
          "</div></fieldset>"
        );
      }
      function textField(key, title, value, placeholder) {
        return (
          '<label class="field" for="' +
          key +
          '">' +
          title +
          '</label><input type="text" maxlength="30" id="' +
          key +
          '" name="' +
          key +
          '" placeholder="' +
          placeholder +
          '" value="' +
          escape(value) +
          '">'
        );
      }
      function budget() {
        return Number(profile.daily?.value) || 10;
      }
      function buildPlan() {
        const total = budget(),
          warm = Math.max(1, Math.floor(total * 0.2)),
          review = Math.max(1, Math.floor(total * 0.2));
        const focus = survey.skill || "speaking",
          tip =
            blockers[focus]?.find((x) => x[0] === survey.challenge)?.[2] || "",
          topic =
            nameOf(topics, profile.interests?.values?.[0]) || "kundalik hayot";
        const context =
          {
            work: "ish suhbatidan",
            travel: "sayohatdan",
            movies: "film yoki qo‘shiqdan",
            ielts: "imtihon topshirig‘idan",
            general: "kundalik suhbatdan",
          }[profile.goal?.value] || "kundalik suhbatdan";
        const advanced = ["B2", "C1", "C2"].includes(profile.level?.value),
          mid = profile.level?.value === "B1";
        const task = {
          speaking: advanced
            ? "Ikki fikrni solishtirib, har biriga dalil keltiring."
            : mid
              ? "Bir daqiqa gapiring va fikringizga misol keltiring."
              : "Uchta sodda gapni ovoz chiqarib ayting.",
          listening:
            "Qisqa audio tinglang. " +
            (advanced
              ? "Ohang va yashirin fikrni izohlang."
              : mid
                ? "Asosiy fikr va ikki tafsilotni ayting."
                : "Tanish uchta so‘zni yozib oling."),
          reading:
            "Qisqa parcha o‘qing. " +
            (advanced
              ? "Muallif nuqtayi nazarini matndan dalil bilan tushuntiring."
              : mid
                ? "Asosiy fikrni ikki gapda yozing."
                : "Tanish iboralarni ajrating."),
          writing: advanced
            ? "Fikringizni yozib, unga qarshi bitta dalilni muhokama qiling."
            : mid
              ? "Bog‘lovchi so‘zlar bilan qisqa xatboshi yozing."
              : "Mavzu haqida uchta sodda gap yozing.",
        }[focus];
        return [
          [warm, topic + " mavzusiga oid iboralarni tanlang."],
          [
            total - warm - review,
            context[0].toUpperCase() +
              context.slice(1) +
              " bir vaziyat tanlang. " +
              task +
              (tip ? " " + tip : ""),
          ],
          [
            review,
            "Ikkita foydali iborani esdan qaytaring va bittasini yangi gapda ishlating.",
          ],
        ];
      }
      function summary() {
        const plan = buildPlan(),
          name = profile.name?.firstName?.trim();
        return (
          '<ul class="facts">' +
          [
            nameOf(goals, profile.goal?.value),
            profile.goal?.value === "ielts" ? nameOf(exam, survey.exam) : "",
            profile.level?.value,
            nameOf(skills, survey.skill),
            budget() * (survey.days || 3) + " daqiqa / hafta",
          ]
            .filter(Boolean)
            .map((x) => "<li>" + escape(x) + "</li>")
            .join("") +
          '</ul><section class="lesson"><h2>' +
          escape(name ? name + " uchun birinchi dars" : "Birinchi dars") +
          "</h2><ol>" +
          plan
            .map(
              ([m, t]) =>
                "<li><b>" + m + " daqiqa</b> · " + escape(t) + "</li>",
            )
            .join("") +
          "</ol></section>"
        );
      }
      function sidebar() {
        const mins = profile.daily?.value;
        $("snapshot").innerHTML =
          "<strong>" +
          escape(
            mins
              ? mins + " daqiqa"
              : nameOf(skills, survey.skill) || "WordDrop",
          ) +
          "</strong>" +
          escape(mins ? "Har mashg‘ulot uchun" : "Shaxsiy o‘quv rejasi");
        $("route").innerHTML = labels
          .map(
            (t, i) =>
              '<li class="' +
              (i === step ? "active" : i < step ? "done" : "") +
              '">' +
              t +
              "</li>",
          )
          .join("");
      }
      function render(focus = false) {
        sidebar();
        $("counter").textContent = step + 1 + " / 5  ·  " + labels[step];
        $("progress").value = step + 1;
        $("title").textContent = intro[step];
        $("intro").textContent = desc[step];
        $("back").hidden = step === 0;
        $("skip").hidden = step === 4;
        $("notice").textContent = "";
        $("next").textContent =
          step === 4 ? "Rejani saqlash va boshlash" : "Davom etish →";
        const level = survey.unknown ? "unknown" : profile.level?.value;
        const screens = [
          () =>
            options("goal", "Asosiy maqsad", goals, profile.goal?.value) +
            '<div id="examChoice">' +
            (profile.goal?.value === "ielts"
              ? options("exam", "Qaysi imtihon?", exam, survey.exam)
              : "") +
            "</div>" +
            textField(
              "firstName",
              "Sizga qanday murojaat qilaylik? (ixtiyoriy)",
              profile.name?.firstName,
              "Ism yoki taxallus",
            ),
          () => options("level", "Boshlang‘ich daraja", levels, level),
          () =>
            options("skill", "Ustuvor ko‘nikma", skills, survey.skill) +
            '<div id="challenge">' +
            challenge() +
            "</div>" +
            options(
              "interests",
              "Qiziqishlaringiz (ixtiyoriy)",
              topics,
              profile.interests?.values,
              true,
            ),
          () =>
            options(
              "daily",
              "Bir mashg‘ulot davomiyligi",
              [5, 10, 20, 30].map((n) => [String(n), n + " daqiqa"]),
              String(profile.daily?.value),
            ) +
            options(
              "days",
              "Haftada necha kun?",
              [2, 3, 5, 7].map((n) => [String(n), n + " kun"]),
              String(survey.days),
            ) +
            options(
              "notify",
              "Eslatma afzalliklari (ixtiyoriy)",
              notes,
              profile.notify?.values,
              true,
            ),
          summary,
        ];
        $("fields").innerHTML = screens[step]();
        if (focus) {
          $("title").focus({ preventScroll: true });
          window.scrollTo(0, 0);
        }
      }
      $("form").addEventListener("input", (e) => {
        const { name, value } = e.target;
        if (name === "firstName") {
          (profile.name ??= {}).firstName = value;
        } else if (name === "goal") {
          profile.goal = { value, label: nameOf(goals, value) };
          $("examChoice").innerHTML =
            value === "ielts"
              ? options("exam", "Qaysi imtihon?", exam, survey.exam)
              : "";
        } else if (name === "level") {
          survey.unknown = value === "unknown";
          profile.level = {
            value: survey.unknown ? "" : value,
            desc: nameOf(levels, value),
          };
        } else if (name === "daily") profile.daily = { value: Number(value) };
        else if (name === "days") survey.days = Number(value);
        else if (name === "skill") {
          survey.skill = value;
          delete survey.challenge;
          $("challenge").innerHTML = challenge();
        } else if (["exam", "challenge"].includes(name)) survey[name] = value;
        else if (["interests", "notify"].includes(name))
          profile[name] = {
            values: Array.from(
              document.querySelectorAll('input[name="' + name + '"]:checked'),
              (n) => n.value,
            ),
          };
        persist();
        sidebar();
        $("notice").textContent = "";
      });
      function move(n) {
        step = n;
        persist();
        render(true);
      }
      $("back").onclick = () => move(Math.max(0, step - 1));
      $("skip").onclick = () => {
        profile.goal ??= { value: "general", label: nameOf(goals, "general") };
        survey.skill ??= "speaking";
        profile.daily ??= { value: 10 };
        survey.days ??= 3;
        move(4);
      };
      $("form").onsubmit = async (e) => {
        e.preventDefault();
        if (busy) return;
        const ok = [
          profile.goal?.value &&
            (profile.goal.value !== "ielts" || survey.exam),
          profile.level?.value || survey.unknown,
          survey.skill,
          profile.daily?.value && survey.days,
          true,
        ][step];
        if (!ok) {
          $("notice").textContent =
            "Davom etish uchun yuqoridagi savolga javob tanlang.";
          return;
        }
        if (step < 4) {
          move(step + 1);
          return;
        }
        busy = true;
        for (const b of [$("back"), $("next")]) b.disabled = true;
        survey.firstLesson = buildPlan();
        persist();
        $("notice").textContent = "Profil saqlanmoqda…";
        try {
          if (!window.wdSubmitProfile) throw Error();
          await window.wdSubmitProfile(profile);
          write("wd_onb_done_v3", 1);
          write("wd_onb_plan_step", 0);
          let target = window.wdNextTarget();
          if (target === "app.html") {
            if (profile.goal?.value === "ielts" && survey.exam === "multilevel")
              target += "#ml";
            else if (survey.skill === "reading") target += "#adabiyot";
          }
          location.assign(target);
        } catch {
          $("notice").textContent =
            "Javoblaringiz shu qurilmada saqlandi. Internet aloqasini tekshirib, qayta urinib ko‘ring.";
          busy = false;
          for (const b of [$("back"), $("next")]) b.disabled = false;
        }
      };
      render();
    </script>

    <script type="module">
      import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

      /* WordDrop Supabase — bir xil kalitlar admin.html bilan */
      const SUPABASE_URL = "https://jgeycbyaoiybpudakgmk.supabase.co";
      const SUPABASE_KEY = "sb_publishable_b_6vafUIGzOO9xJmFv2t9g_sQD3kQ1J";
      const sb = createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: { persistSession: true, autoRefreshToken: true },
      });

      /*
  submitProfile(profile) — onboarding tugagandan keyin chaqiriladi.
  Foydalanuvchi auth qilinmagan bo'lsa, anonim sessiya ochiladi (guest).
  Ma'lumot `wd_profiles` jadvaliga upsert qilinadi.
*/
      async function submitProfile(profile) {
        // 1) Auth: mavjud sessiya (app.html'dan meros) yoki mehmon anon
        let {
          data: { user },
        } = await sb.auth.getUser();
        let isGuest = user ? !user.email : false;
        if (!user) {
          const { data, error } = await sb.auth.signInAnonymously();
          if (error) {
            throw new Error("Auth failed: " + error.message);
          }
          user = data.user;
          isGuest = true;
          // Mehmon UID'ni saqlaymiz — keyin ro'yxatdan o'tsa link uchun kerak
          try {
            localStorage.setItem("wd_guest_uid", user.id);
          } catch (_) {}
        }

        // 2) Profil ma'lumotlarini normalizatsiya qilish
        const payload = {
          user_id: user.id,
          is_guest: isGuest,
          first_name: profile.name?.firstName?.trim() || null,
          last_name: profile.name?.lastName?.trim() || null,
          level: profile.level?.value || null,
          level_desc: profile.level?.desc || null,
          goal: profile.goal?.value || null,
          goal_label: profile.goal?.label || null,
          interests: profile.interests?.values || [],
          daily_min: profile.daily?.value || null,
          notify: profile.notify?.values || [],
          locale: navigator.language || "uz-UZ",
          user_agent: navigator.userAgent.slice(0, 200),
          completed_at: new Date().toISOString(),
        };

        // 3) Upsert (bir foydalanuvchi bir profil)
        const { data, error } = await sb
          .from("wd_profiles")
          .upsert(payload, { onConflict: "user_id" })
          .select()
          .single();

        if (error) throw error;

        // 4) Onboarding funnel eventini yozish
        await sb
          .from("wd_onboarding_events")
          .insert({
            user_id: user.id,
            event: "finish",
            is_guest: isGuest,
          })
          .then(() => {})
          .catch(() => {});

        return data;
      }

      /*
  Onboarding boshlanganda va har muhim qadamda funnel eventi yozamiz.
  RLS: har foydalanuvchi faqat o'z eventini yoza oladi.
*/
      async function logEvent(event) {
        try {
          // Faqat mavjud sessiya bo'lsa yozamiz — bu yerda mehmon yaratmaymiz
          // (finish() paytida submitProfile o'zi anon session ochib beradi)
          const {
            data: { user },
          } = await sb.auth.getUser();
          if (!user) return;
          await sb.from("wd_onboarding_events").insert({
            user_id: user.id,
            event,
            is_guest: !user.email,
          });
        } catch (_) {}
      }

      /*
  Boot: agar foydalanuvchi allaqachon onboarding yakunlagan bo'lsa,
  darhol app.html'ga yo'naltiramiz (yoki ?next= dan olingan manzilga).
*/
      function nextTarget() {
        const u = new URL(location.href);
        const n = u.searchParams.get("next");
        // Xavfsizlik: faqat oddiy nisbiy yo'l qabul qilinadi (protocol/domain/../ YO'Q)
        if (n && /^[a-zA-Z0-9_\-.]+\.html(\?.*)?$/.test(n)) {
          return n;
        }
        // Default: app.html — asosiy ilova (bir xil papkada, root'da)
        return "app.html";
      }

      async function bootCheck() {
        try {
          const {
            data: { user },
          } = await sb.auth.getUser();
          if (!user) return; // Sessiya yo'q — hech narsa qilmaymiz
          const { data } = await sb
            .from("wd_profiles")
            .select("completed_at")
            .eq("user_id", user.id)
            .maybeSingle();
          if (data && data.completed_at) {
            // Allaqachon yakunlangan — to'g'ridan-to'g'ri ilovaga
            location.replace(nextTarget());
          }
        } catch (_) {}
      }

      // Global expose
      window.wdSubmitProfile = submitProfile;
      window.wdLogEvent = logEvent;
      window.wdBootCheck = bootCheck;
      window.wdNextTarget = nextTarget;

      // Ilova ochilganda "welcome_seen" eventini yozamiz (agar sessiya bor bo'lsa)
      logEvent("welcome_seen").catch(() => {});

      // Yakunlangan foydalanuvchini tekshiramiz
      bootCheck();
    </script>
