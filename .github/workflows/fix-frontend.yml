name: Fix frontend folder

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create frontend from fronted if needed
        run: |
          if [ -d "fronted" ] && [ ! -d "frontend" ]; then
            mkdir -p frontend
            cp -a fronted/. frontend/
          fi
